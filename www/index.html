          <div class="panel-title">What needs your attention</div>
          <div class="tiny">${isCurrent ? 'Month ' + Math.round(elapsedPct) + '% elapsed' : 'Month closed'}</div>
        </div>
        <div class="panel-body" style="padding-top:8px">
          ${bt > 0 ? `<div style="margin-bottom:6px;display:flex;justify-content:space-between;gap:10px;align-items:baseline">
            <div class="tiny">Spent ${money(t.expense)} of ${money(bt)} budget</div>
            <div class="tiny num">${pct(pacePct)}</div>
          </div>
          <div class="pace">
            <div class="pace-track"><i class="pace-fill ${paceClass}" style="width:${clamp(pacePct, 0, 100)}%"></i>${isCurrent ? `<i class="pace-mark" style="left:${elapsedPct}%"></i>` : ''}</div>
          </div>
          <div class="pace"><div class="pace-label" style="margin-left:0">${isCurrent ? `The mark is where you should be by today if spending were even.` : ''}</div></div>` : ''}
          <ul class="notes">
            ${visibleNotes.length ? visibleNotes.map(n => `<li class="note ${n.level}">${noteIco(n.level)}<div>${n.html}</div></li>`).join('') :
        `<li class="note ok">${ICON.ok}<div>Nothing looks off. Add a few entries and this panel will start pointing things out.</div></li>`}
          </ul>
        </div>
      </div>
    </div>

    <div class="grid grid-half" style="margin-bottom:18px">
      <div class="panel">
        <div class="panel-head">
          <div class="panel-title">Coming due</div>
          <div class="tiny">Next 30 days · ${money(sum(dues.filter(d => !d.paid), d => d.amount - (d.paidAmount || 0)))}</div>
        </div>
        <div class="panel-body" style="padding-top:4px"><div class="dues">${dueRows}</div></div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <div class="panel-title">Where the money went</div>
          <button class="btn btn-ghost btn-sm" type="button" data-action="goto" data-view="budgets">Budgets</button>
        </div>
        <div class="panel-body" style="padding-top:8px">${meterRows}</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <div class="panel-title">Recent entries</div>
        <button class="btn btn-ghost btn-sm" type="button" data-action="goto" data-view="transactions">See all</button>
      </div>
      <div style="padding:0"><div class="txlist">${recentRows}</div></div>
    </div>
  `;
}

function txRowHTML(t) {
  const isIn = t.type === 'income', isMove = t.type === 'transfer';
  const sub = [(t.type === 'expense' && t.cardId) ? ((cardById(t.cardId) || {}).name || 'Card') : (t.accountId && !isMove ? acctName(t.accountId) : ''), payLabel(t.payMethod), t.note].filter(Boolean).join(' · ');
  const amt = isMove
    ? money(t.amount)
    : (isIn ? '+' : '−') + money(t.amount);
  return `<button class="tx" type="button" data-action="edit-tx" data-id="${t.id}">
    <div class="tx-date">${parseISO(t.date).getDate()} ${MON[parseISO(t.date).getMonth()]}</div>
    <div class="tx-main">
      <div class="tx-title">${esc(isMove ? transferLabel(t) : catName(t))}</div>
      <div class="tx-sub">${esc(sub || '—')}</div>
    </div>
    <div class="tx-cat"><span class="dotkey" style="background:${catTint(t)}"></span>${esc(isMove ? 'Transfer' : catName(t))}</div>
    <div class="tx-amt ${isIn ? 'in' : isMove ? 'move' : 'out'}">${amt}</div>
  </button>`;
}

/* ---------- TRANSACTIONS ---------- */
let txFilter = { q: '', type: 'all', cat: 'all' };

function renderTransactions() {
  const ym = S.settings.ym;
  const all = txInMonth(ym);
  const q = txFilter.q.trim().toLowerCase();
  const list = all.filter(t => {
    if (txFilter.type !== 'all' && t.type !== txFilter.type) return false;
    if (txFilter.cat !== 'all' && t.categoryId !== txFilter.cat) return false;
    if (!q) return true;
    return [catName(t), t.note, acctName(t.accountId), (t.amount + '')].join(' ').toLowerCase().includes(q);
  });

  /* group by date */
  const groups = new Map();
  for (const t of list) {
    if (!groups.has(t.date)) groups.set(t.date, []);
    groups.get(t.date).push(t);
  }
  const groupHTML = [...groups.entries()].map(([date, rows]) => {
    const dayNet = r2(sum(rows.filter(r => r.type === 'income'), r => r.amount) - sum(rows.filter(r => r.type === 'expense'), r => r.amount));
    return `<div style="display:flex;justify-content:space-between;align-items:baseline;padding:14px 18px 6px;background:#F1F5F9;border-bottom:1px solid var(--rule)">
      <div style="font-size:12.5px;color:var(--ink-soft);font-weight:500">${fmtDayFull(date)}</div>
      <div class="num tiny">${dayNet >= 0 ? '+' : ''}${money(dayNet)}</div>
    </div>${rows.map(txRowHTML).join('')}`;
  }).join('');

  const t = monthTotals(ym);
  const catOptions = S.categories.map(c => `<option value="${c.id}" ${txFilter.cat === c.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('');

  $('#view-transactions').innerHTML = `
    <div class="view-head">
      <div>
        <h2 class="section-title">Transactions</h2>
        <div class="section-note">${monthLabel(ym)} · ${all.length} entr${all.length === 1 ? 'y' : 'ies'} · in ${money(t.income)}, out ${money(t.expense)}</div>
      </div>
      <button class="btn btn-primary" type="button" data-action="add">Add entry</button>
    </div>

    <div class="panel">
      <div class="toolbar">
        <input class="field search" type="search" id="txSearch" placeholder="Search note, category, amount…" value="${esc(txFilter.q)}" aria-label="Search transactions">
        <select class="field sel" id="txType" aria-label="Filter by type">
          <option value="all" ${txFilter.type === 'all' ? 'selected' : ''}>All entries</option>
          <option value="expense" ${txFilter.type === 'expense' ? 'selected' : ''}>Expenses only</option>
          <option value="income" ${txFilter.type === 'income' ? 'selected' : ''}>Income only</option>
          <option value="transfer" ${txFilter.type === 'transfer' ? 'selected' : ''}>Transfers only</option>
        </select>
        <select class="field sel" id="txCat" aria-label="Filter by category">
          <option value="all">Every category</option>${catOptions}
        </select>
        ${(txFilter.q || txFilter.type !== 'all' || txFilter.cat !== 'all') ? `<button class="btn btn-ghost btn-sm" type="button" data-action="clear-filters">Clear</button>` : ''}
      </div>
      ${list.length ? `<div class="txlist">${groupHTML}</div>` : `<div style="padding:44px 20px;text-align:center">
        <div class="serif" style="font-size:19px;margin-bottom:6px">${all.length ? 'No entries match that filter' : 'No entries this month yet'}</div>
        <div class="tiny" style="max-width:34ch;margin:0 auto 16px">${all.length ? 'Try a different search, or clear the filters.' : 'Record the first purchase or paycheque and the month starts taking shape.'}</div>
        <button class="btn btn-primary" type="button" data-action="add">Add entry</button>
      </div>`}
    </div>`;

  const s = $('#txSearch');
  if (s) {
    s.addEventListener('input', e => { txFilter.q = e.target.value; renderTransactions(); const ns = $('#txSearch'); if (ns) { ns.focus(); ns.setSelectionRange(ns.value.length, ns.value.length); } });
    $('#txType').addEventListener('change', e => { txFilter.type = e.target.value; renderTransactions(); });
    $('#txCat').addEventListener('change', e => { txFilter.cat = e.target.value; renderTransactions(); });
  }
}

/* ---------- BUDGETS ---------- */
const EXPENSE_GROUPS = [
  { label: 'Needs — essentials', cats: ['Rent', 'Groceries', 'Vegetables & fruit', 'Electricity', 'Mobile & internet', 'Transport & fuel', 'Medical', 'Household help', 'Insurance', 'School & fees'] },
  { label: 'Wants — lifestyle', cats: ['Eating out', 'Shopping', 'Entertainment', 'Subscriptions', 'Unplanned'] }
];

function renderBudgets() {
  const ym = S.settings.ym;
  const t = monthTotals(ym);
  const spent = spentByCat(ym);
  const bt = budgetTotal();
  const { dim } = monthBounds(ym);
  const isCurrent = ym === today().slice(0, 7);
  const dayNow = isCurrent ? new Date().getDate() : dim;
  const elapsed = clamp(dayNow / dim * 100, 0, 100);
  const daysLeft = isCurrent ? Math.max(0, dim - dayNow) : 0;

  const txnCount = {};
  for (const x of t.list) if (x.type === 'expense') txnCount[x.categoryId] = (txnCount[x.categoryId] || 0) + 1;

  const expCats = S.categories.filter(c => c.kind === 'expense');

  const rowHTML = c => {
    const used = spent[c.id] || 0, b = Number(c.budget) || 0;
    const p = b > 0 ? used / b * 100 : 0;
    const cls = p > 100 ? 'over' : (p > 60 && !FIXED_CATS.has(c.name)) ? 'warn' : '';
    const left = b - used;
    const avg = used && txnCount[c.id] ? used / txnCount[c.id] : 0;
    const projected = isCurrent && used && !FIXED_CATS.has(c.name) ? r2(used / Math.max(1, dayNow) * dim) : used;
    return `<div class="bmeter" style="grid-template-columns:minmax(120px,1.1fr) minmax(0,1.8fr) 150px 92px" data-cat-row="${c.id}">
      <div class="bm-name"><span class="dotkey" style="background:${c.tint}"></span><span>${esc(c.name)}</span></div>
      <div>
        <div class="bm-bar" style="height:10px"><i class="bm-fill ${cls}" style="width:${clamp(p, 0, 100)}%"></i>${isCurrent && b > 0 ? `<i class="bm-pace" style="left:${elapsed}%"></i>` : ''}</div>
        <div class="tiny" style="margin-top:4px;display:flex;gap:10px;flex-wrap:wrap">
          <span>${txnCount[c.id] || 0} entries${avg ? ' · avg ' + money(avg) : ''}</span>
          ${isCurrent && used > 0 && b > 0 ? `<span style="color:${projected > b ? 'var(--red)' : 'var(--ink-faint)'}">heading for ${money(projected)}</span>` : ''}
        </div>
      </div>
      <div class="bm-num" style="min-width:0">${money(used)} <span class="tiny">of ${money(b)}</span>
        <span class="sub ${left < 0 ? 'over' : ''}">${b > 0 ? (left < 0 ? money(-left) + ' over' : money(left) + ' left') : 'no limit set'}</span></div>
      <div><input class="field budget-inp" type="number" min="0" step="100" value="${b || ''}" placeholder="0" data-budget-for="${c.id}" aria-label="Monthly budget for ${esc(c.name)}" style="width:100%;text-align:right;font-family:var(--mono)"></div>
    </div>`;
  };

  /* group categories, keeping any user-added ones in a final group */
  const known = new Set(EXPENSE_GROUPS.flatMap(g => g.cats));
  const leftovers = expCats.filter(c => !known.has(c.name));

  const groupHTML = EXPENSE_GROUPS.map(g => {
    const cats = g.cats.map(n => expCats.find(c => c.name === n)).filter(Boolean);
    if (!cats.length) return '';
    const gBudget = r2(sum(cats, c => c.budget)), gUsed = r2(sum(cats, c => spent[c.id] || 0));
    return `<div class="panel-head" style="background:#F1F5F9;padding:11px 18px">
        <div style="font-size:12.5px;font-weight:600;letter-spacing:.02em">${g.label}</div>
        <div class="tiny num">${money(gUsed)} of ${money(gBudget)}</div>
      </div><div style="padding:2px 18px">${cats.map(rowHTML).join('')}</div>`;
  }).join('');
  const leftoverHTML = leftovers.length
    ? `<div class="panel-head" style="background:#F1F5F9;padding:11px 18px"><div style="font-size:12.5px;font-weight:600">Your own categories</div><div class="tiny num">${money(sum(leftovers, c => spent[c.id] || 0))} of ${money(sum(leftovers, c => c.budget))}</div></div><div style="padding:2px 18px">${leftovers.map(rowHTML).join('')}</div>`
    : '';

  const salary = Number(S.settings.salary) || 0, sPct = clamp(Number(S.settings.savingsPct) || 0, 0, 100);
  const saveTarget = r2(salary * sPct / 100), spendCap = r2(salary - saveTarget);
  const needsB = r2(sum(EXPENSE_GROUPS[0].cats.map(n => expCats.find(c => c.name === n)).filter(Boolean), c => c.budget));
  const wantsB = r2(bt - needsB);
  const splitBase = Math.max(salary, bt + saveTarget, 1);
  const wd = v => (v / splitBase * 100).toFixed(2);
  const ofSal = v => salary > 0 ? pct(v / salary * 100) + ' of salary' : '';
  const planOver = bt > spendCap + 0.5;
  const savedNow = r2(salary - t.expense);
  const legend = (c, nm, v) => `<div class="it"><span class="dotkey" style="background:${c}"></span><div><div class="nm">${nm}</div><div class="am">${money(v)}</div><div class="pc">${ofSal(v)}</div></div></div>`;
  const planHTML = `<div class="panel" style="margin-bottom:18px">
      <div class="panel-head"><div class="panel-title">Salary plan</div><div class="tiny">Limits are sized to your salary</div></div>
      <div class="panel-body">
        <div class="plan-inputs">
          <div><label class="fl" for="planSalary">Monthly salary (₹)</label><input class="inp" id="planSalary" type="number" min="0" step="500" value="${salary || ''}"></div>
          <div><label class="fl" for="planPct">Savings goal (% of salary)</label><input class="inp" id="planPct" type="number" min="0" max="90" step="1" value="${sPct}"></div>
          <div><div class="fl">Available to spend</div><div class="plan-fig">${money(spendCap)}</div></div>
          <div><div class="fl">Savings target</div><div class="plan-fig" style="color:var(--green)">${money(saveTarget)}</div></div>
        </div>
        <div class="split-bar" role="img" aria-label="Salary split into needs, wants and savings">
          <i class="split-seg" style="width:${wd(needsB)}%;background:#1E3A8A"></i><i class="split-seg" style="width:${wd(wantsB)}%;background:#0E7490"></i><i class="split-seg" style="width:${wd(saveTarget)}%;background:#15803D"></i>
        </div>
        <div class="split-legend">${legend('#1E3A8A', 'Needs — essentials', needsB)}${legend('#0E7490', 'Wants — lifestyle', wantsB)}${legend('#15803D', 'Savings', saveTarget)}</div>
        <div class="plan-note">
          <div class="${planOver ? '' : 'tiny'}" style="${planOver ? 'color:var(--red)' : ''}">${planOver
            ? `Limits add up to ${money(bt)} — ${money(bt - spendCap)} more than the ${money(spendCap)} you can spend.`
            : salary > 0 ? `Limits fit the plan. ${isCurrent ? `So far this month: spent ${money(t.expense)}, ${savedNow >= 0 ? 'saved ' + money(savedNow) : 'short by ' + money(-savedNow)} against the salary.` : ''}` : 'Enter your salary to size the plan.'}</div>
          ${salary > 0 && Math.abs(bt - spendCap) > 0.5 ? '<button class="btn btn-sm" type="button" data-action="fit-budgets">Fit limits to salary</button>' : ''}
        </div>
      </div>
    </div>`;
  const leftTotal = r2(bt - t.expense);
  const avgAllowance = daysLeft > 0 ? leftTotal / daysLeft : 0;

  $('#view-budgets').innerHTML = `
    <div class="view-head">
      <div>
        <h2 class="section-title">Monthly budget</h2>
        <div class="section-note">${isCurrent
      ? `${monthLabel(ym)} · ${daysLeft} day${daysLeft === 1 ? '' : 's'} left. The tick on each bar shows where an even spend would be today. Limits repeat every month.`
      : `${monthLabel(ym)} · closed. Lines show what actually happened.`}</div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn" type="button" data-action="new-category">New category</button>
      </div>
    </div>

    ${planHTML}
    <div class="grid grid-half" style="margin-bottom:18px">
      <div class="slip">
        <div class="slip-head"><div class="t">Budget against actual</div><div class="m">${isCurrent ? daysLeft + ' days left' : 'closed'}</div></div>
        <div class="slip-rows">
          <div class="srow"><div class="k">Planned for the month</div><div class="v">${money(bt)}</div></div>
          <div class="srow"><div class="k"><span class="dotkey out"></span>Spent so far</div><div class="v neg">${money(t.expense)}</div></div>
          <div class="srow total"><div class="k">${leftTotal >= 0 ? 'Still available' : 'Over the plan'}</div><div class="v" style="color:${leftTotal < 0 ? 'var(--red)' : 'inherit'}">${money(Math.abs(leftTotal))}</div></div>
        </div>
        <div class="slip-foot">
          <div class="sfcell"><div class="l">Per day left</div><div class="n">${daysLeft > 0 ? money(avgAllowance) : '—'}</div></div>
          <div class="sfcell"><div class="l">Used</div><div class="n">${bt > 0 ? pct(t.expense / bt * 100) : '—'}</div></div>
          <div class="sfcell"><div class="l">Time elapsed</div><div class="n">${pct(elapsed)}</div></div>
        </div>
      </div>
      <div class="panel">
        <div class="panel-head"><div class="panel-title">Adjustments worth making</div></div>
        <div class="panel-body" style="padding-top:8px">
          <ul class="notes">${(() => {
      const ns = insights(ym).filter(n => /budget|over|left|pace/i.test(n.html)).slice(0, 4);
      return ns.length ? ns.map(n => `<li class="note ${n.level}">${noteIco(n.level)}<div>${n.html}</div></li>`).join('')
        : `<li class="note ok">${ICON.ok}<div>Every category sits inside its limit. Leave the numbers alone.</div></li>`;
    })()}</ul>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <div class="panel-title">Category limits</div>
        <div class="tiny">Type a new figure — it saves as you go</div>
      </div>
      ${groupHTML}${leftoverHTML}
      <div class="panel-foot" style="display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap">
        <div class="tiny">Total budget <strong class="num" style="color:var(--ink)">${money(bt)}</strong></div>
        <div class="tiny">${t.income > 0 ? (bt > t.income ? `<span style="color:var(--red)">Budgets exceed income by ${money(bt - t.income)}</span>` : `${pct(bt / t.income * 100)} of income allocated`) : 'Add income entries to compare budgets against earnings'}</div>
      </div>
    </div>`;

  const salInp = $('#planSalary'), pctInp = $('#planPct');
  if (salInp) salInp.addEventListener('change', e => { S.settings.salary = Math.max(0, r2(Number(e.target.value) || 0)); save(); renderBudgets(); });
  if (pctInp) pctInp.addEventListener('change', e => { S.settings.savingsPct = clamp(Math.round(Number(e.target.value) || 0), 0, 90); save(); renderBudgets(); });
  $$('.budget-inp', $('#view-budgets')).forEach(inp => {
    inp.addEventListener('change', e => {
      const c = catById(e.target.dataset.budgetFor);
      if (!c) return;
      c.budget = Math.max(0, r2(Number(e.target.value) || 0));
      save(); flash(e.target); renderBudgets();
    });
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); } });
  });
}

function flash(el) { el.animate([{ background: '#E4E6FD' }, { background: '#fff' }], { duration: 600, easing: 'ease-out' }); }

/* ---------- LOANS ---------- */
function renderLoans() {
  const loans = S.loans;
  const totalOut = r2(sum(loans, l => loanStatus(l).outstanding));
  const totalEmi = r2(sum(loans.filter(l => !loanStatus(l).done), l => loanStatus(l).sch.emi));
  const totalInterest = r2(sum(loans, l => loanStatus(l).sch.totalInterest));

  const cards = loans.map(l => {
    const st = loanStatus(l);
    const next = nextEMI(l);
    const nextChip = st.done ? '<span class="chip due-paid">Closed</span>'
      : next && !next.paid ? `<span class="chip ${daysBetween(today(), next.date) <= 3 ? 'due-urgent' : daysBetween(today(), next.date) <= 10 ? 'due-soon' : 'due-ok'}">Next ${fmtDay(next.date)}</span>`
        : `<span class="chip due-paid">This month paid</span>`;
    return `<div class="inst">
      <div class="inst-top">
        <div>
          <div class="inst-name">${esc(l.name)}</div>
          <div class="inst-sub">${esc(l.lender || 'Loan')} · ${l.rate}% p.a. · ${l.tenure} months</div>
        </div>
        <div style="display:flex;gap:4px;align-items:center">
          ${nextChip}
          <button class="btn btn-ghost btn-sm" type="button" data-action="edit-loan" data-id="${l.id}" aria-label="Edit ${esc(l.name)}">Edit</button>
        </div>
      </div>
      <div class="kv">
        <div><div class="k">Outstanding</div><div class="v" style="font-size:20px">${money(st.outstanding)}</div></div>
        <div><div class="k">Monthly EMI</div><div class="v" style="font-size:20px">${money(st.sch.emi)}</div></div>
        <div><div class="k">Paid so far</div><div class="v">${money(st.paid)}</div></div>
        <div><div class="k">Interest paid</div><div class="v" style="color:var(--ochre)">${money(st.interestPaid)}</div></div>
        <div><div class="k">EMIs left</div><div class="v">${st.remaining}${st.payoffDate ? ' <span class="tiny">till ' + monthLabel(st.payoffDate.slice(0, 7)) + '</span>' : ''}</div></div>
        <div><div class="k">Total interest if held</div><div class="v">${money(st.sch.totalInterest)}</div></div>
      </div>
      <div style="margin-top:16px">
        <div class="bm-bar" style="height:7px"><i class="bm-fill" style="width:${st.paidPct}%"></i></div>
        <div style="display:flex;justify-content:space-between;margin-top:5px" class="tiny">
          <span>${pct(st.paidPct)} repaid</span><span>${st.done ? 'Loan closed' : money(st.outstanding) + ' to go'}</span>
        </div>
      </div>
      <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">
        <button class="btn btn-sm" type="button" data-action="pay-emi" data-id="${l.id}" ${st.done ? 'disabled' : ''}>Mark EMI paid</button>
        <button class="btn btn-sm" type="button" data-action="prepay" data-id="${l.id}" ${st.done ? 'disabled' : ''}>Record prepayment</button>
        <button class="btn btn-sm btn-ghost" type="button" data-action="schedule" data-id="${l.id}">Schedule</button>
      </div>
    </div>`;
  }).join('');

  $('#view-loans').innerHTML = `
    <div class="view-head">
      <div>
        <h2 class="section-title">Loans &amp; EMIs</h2>
        <div class="section-note">What you still owe, what each month costs, and how much of your repayments is interest.</div>
      </div>
      <button class="btn btn-primary" type="button" data-action="new-loan">Add a loan</button>
    </div>

    ${loans.length ? `<div class="slip" style="margin-bottom:18px">
      <div class="slip-head"><div class="t">Position across all loans</div><div class="m">${loans.length} loan${loans.length > 1 ? 's' : ''}</div></div>
      <div class="slip-rows">
        <div class="srow"><div class="k">Total outstanding</div><div class="v">${money(totalOut)}</div></div>
        <div class="srow"><div class="k">Committed every month</div><div class="v neg">${money(totalEmi)}</div></div>
        <div class="srow total"><div class="k">Interest still to come</div><div class="v" style="color:var(--ochre)">${money(totalInterest)}</div></div>
      </div>
      <div class="slip-foot">
        <div class="sfcell"><div class="l">EMIs per year</div><div class="n">${money(totalEmi * 12)}</div></div>
        <div class="sfcell"><div class="l">Share of income</div><div class="n">${monthTotals(S.settings.ym).income > 0 ? pct(totalEmi / monthTotals(S.settings.ym).income * 100) : '—'}</div></div>
        <div class="sfcell"><div class="l">Interest per rupee</div><div class="n">${sum(loans, l => l.principal) > 0 ? (totalInterest / sum(loans, l => l.principal) * 100).toFixed(0) + 'p' : '—'}</div></div>
      </div>
    </div>
    <div class="grid grid-half">${cards}</div>`
      : `<div class="panel" style="padding:48px 24px;text-align:center">
        <div class="serif" style="font-size:22px;margin-bottom:8px">No loans tracked yet</div>
        <div class="tiny" style="max-width:42ch;margin:0 auto 18px">Add a home, car, personal or education loan. Expense Tracker works out the EMI, splits every instalment into principal and interest, and shows how a prepayment changes the picture.</div>
        <button class="btn btn-primary" type="button" data-action="new-loan">Add your first loan</button>
      </div>`}
  `;
}

/* ---------- CARDS ---------- */
function renderCards() {
  const rows = S.cards.map(c => ({ c, p: cardPosition(c, today()) }));
  const totBilled = r2(sum(rows, x => x.p.outstanding));
  const totUnbilled = r2(sum(rows, x => x.p.unbilled));
  const totLimit = sum(rows, x => x.p.limit);
  const totUsed = r2(totBilled + totUnbilled);

  const dueChip = p => {
    if (p.statementSpend <= 0) return '<span class="chip plain">No bill this cycle</span>';
    if (p.outstanding <= 0) return '<span class="chip due-paid">Bill paid</span>';
    if (p.dueIn < 0) return `<span class="chip due-urgent">Overdue by ${-p.dueIn}d</span>`;
    if (p.dueIn <= 3) return `<span class="chip due-urgent">${p.dueIn === 0 ? 'Due today' : 'Due in ' + p.dueIn + 'd'}</span>`;
    if (p.dueIn <= 10) return `<span class="chip due-soon">Due in ${p.dueIn}d</span>`;
    return `<span class="chip due-ok">Due ${fmtDay(p.prev.dueDate)}</span>`;
  };

  const cardHTML = rows.map(({ c, p }) => {
    const stm = cardStatements(c, 4);
    const stmRows = stm.map((s, si) => {
      const open = s.statementDate >= today();
      const status = open ? 'Open — statement on ' + fmtDay(s.statementDate)
        : s.spend <= 0 ? 'Nothing billed'
          : s.paid ? 'Paid ' + money(s.paid.amount) + ' on ' + fmtDay(s.paid.date)
            : si === 1 ? 'Unpaid · due ' + fmtDay(s.dueDate) : 'No payment recorded';
      return `<div class="srow" style="padding:9px 0">
        <div class="k" style="display:block"><div style="color:var(--ink);font-size:13.5px">${open ? 'Current cycle' : 'Statement ' + fmtDay(s.statementDate)}</div><div class="tiny">${fmtDay(s.cycleStart)} – ${fmtDay(s.cycleEnd)} · ${esc(status)}</div></div>
        <div class="v" style="font-size:14px">${money(s.spend)}</div>
      </div>`;
    }).join('');
    const avail = p.limit ? r2(p.limit - p.total) : null;
    return `<div class="inst">
      <div class="card-face">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
          <div><div class="cf-name">${esc(c.name)}</div><div class="cf-num">•••• ${esc(c.last4 || '····')}</div></div>
          <div style="position:relative;z-index:1">${dueChip(p)}</div>
        </div>
        <div class="cf-bal">${money(p.total)}</div>
        <div class="cf-lbl">Owed on this card (billed + unbilled)</div>
        ${p.limit ? `<div class="util ${p.utilPct >= 50 ? 'high' : ''}"><i style="width:${p.utilPct}%"></i></div>
        <div class="cf-lbl" style="margin-top:7px">${pct(p.utilPct)} of ${moneyShort(p.limit)} limit used</div>` : ''}
      </div>
      <div class="card-body">
        <div class="kv" style="margin-top:0">
          <div><div class="k">Still to pay</div><div class="v" style="font-size:18px">${money(p.outstanding)}</div></div>
          <div><div class="k">Due on</div><div class="v">${p.statementSpend > 0 ? fmtDay(p.prev.dueDate) : '—'}</div></div>
          <div><div class="k">Last statement</div><div class="v">${money(p.statementSpend)}</div></div>
          <div><div class="k">Minimum due (est.)</div><div class="v">${p.outstanding > 0 ? money(Math.min(p.minDue, p.outstanding)) : '—'}</div></div>
          <div><div class="k">Unbilled spend</div><div class="v">${money(p.unbilled)}</div></div>
          <div><div class="k">Available credit</div><div class="v">${avail == null ? '—' : money(avail)}</div></div>
        </div>
        <div class="hint" style="margin-top:12px">Next statement on ${fmtDay(p.cyc.statementDate)}. Minimum due is estimated at 5% of the bill (at least ₹500) — your bank's figure may differ.</div>
        <div style="margin-top:14px;border-top:1px solid var(--rule)">${stmRows}</div>
        <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
          <button class="btn btn-sm" type="button" data-action="pay-card" data-id="${c.id}" ${p.outstanding <= 0 ? 'disabled' : ''}>Mark bill paid</button>
          <button class="btn btn-sm btn-ghost" type="button" data-action="edit-card" data-id="${c.id}">Edit card</button>
        </div>
      </div>
    </div>`;
  }).join('');

  $('#view-cards').innerHTML = `
    <div class="view-head">
      <div>
        <h2 class="section-title">Credit cards</h2>
        <div class="section-note">Spend entered with “Credit card” as the payment method lands on the right statement automatically. Mark a bill paid when you clear it.</div>
      </div>
      <button class="btn btn-primary" type="button" data-action="new-card">Add a card</button>
    </div>
    ${S.cards.length ? `<div class="slip" style="margin-bottom:18px">
      <div class="slip-head"><div class="t">Across all cards</div><div class="m">${S.cards.length} card${S.cards.length > 1 ? 's' : ''}</div></div>
      <div class="slip-rows">
        <div class="srow"><div class="k">Billed, still to pay</div><div class="v neg">${money(totBilled)}</div></div>
        <div class="srow"><div class="k">Unbilled this cycle</div><div class="v">${money(totUnbilled)}</div></div>
        <div class="srow total"><div class="k">Total owed</div><div class="v">${money(totUsed)}</div></div>
      </div>
      <div class="slip-foot">
        <div class="sfcell"><div class="l">Combined limit</div><div class="n">${totLimit ? money(totLimit) : '—'}</div></div>
        <div class="sfcell"><div class="l">Utilisation</div><div class="n">${totLimit ? pct(totUsed / totLimit * 100) : '—'}</div></div>
        <div class="sfcell"><div class="l">Available</div><div class="n">${totLimit ? money(totLimit - totUsed) : '—'}</div></div>
      </div>
    </div>
    <div class="grid grid-half">${cardHTML}</div>`
      : `<div class="panel" style="padding:48px 24px;text-align:center">
        <div class="serif" style="font-size:22px;margin-bottom:8px">No cards added yet</div>
        <div class="tiny" style="max-width:44ch;margin:0 auto 18px">Add a credit card with its statement and due days. Expense Tracker groups your card spending into statements, shows what is due and warns you before the due date.</div>
        <button class="btn btn-primary" type="button" data-action="new-card">Add your first card</button>
      </div>`}`;
}

/* ---------- misc helpers ---------- */
let toastT = null;
function toast(msg) {
  const el = $('#toast');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => el.classList.remove('show'), 2800);
}
function ymShift(ym, n) {
  const [y, m] = ym.split('-').map(Number);
  return iso(new Date(y, m - 1 + n, 1, 12)).slice(0, 7);
}
const val = (f, n) => { const el = f.elements.namedItem(n); return el ? el.value : ''; };
const fld = (id, label, input, hint) =>
  `<div class="frow"><label class="fl" for="${id}">${label}</label>${input}${hint ? `<div class="hint">${hint}</div>` : ''}</div>`;
function acctOptions(selected, exclude) {
  return S.accounts.filter(a => a.id !== exclude)
    .map(a => `<option value="${a.id}" ${a.id === selected ? 'selected' : ''}>${esc(a.name)}</option>`).join('');
}
function downloadFile(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}
function transferLabel(t) {
  const from = acctName(t.accountId);
  if (t.billKey) return from + ' → ' + ((cardById(t.cardId) || {}).name || 'Card') + ' bill';
  if (t.loanId) return from + ' → ' + ((loanById(t.loanId) || {}).name || 'Loan') + (t.loanKind === 'prepay' ? ' prepayment' : ' EMI');
  return from + ' → ' + acctName(t.toAccountId);
}
function normalizeState(p) {
  const base = blankState();
  const needsPlan = !(p.settings && p.settings.planV);
  const out = {
    ...base, ...p,
    settings: { ...base.settings, ...(p.settings || {}) },
    categories: Array.isArray(p.categories) && p.categories.length ? p.categories : base.categories,
    accounts: Array.isArray(p.accounts) && p.accounts.length ? p.accounts : base.accounts,
    transactions: Array.isArray(p.transactions) ? p.transactions : [],
    loans: Array.isArray(p.loans) ? p.loans : [],
    cards: Array.isArray(p.cards) ? p.cards : []
  };
  if (needsPlan) { applyPlanBudgets(out); out.settings.planV = 2; }
  return out;
}

/* ---------- dialog plumbing ---------- */
function showDialog(d) {
  if (d.open) return;
  if (typeof d.showModal === 'function') d.showModal(); else d.setAttribute('open', '');
}
function closeDialog(d) {
  if (!d.open) return;
  if (typeof d.close === 'function') d.close(); else d.removeAttribute('open');
}
let auxSubmit = null, auxInput = null;
function openAux(o) {
  const f = $('#auxForm');
  f.style.width = o.wide ? 'min(780px, calc(100vw - 28px))' : '';
  const foot = o.foot !== undefined ? o.foot
    : `<div class="sheet-foot">${o.extraFoot || ''}<button class="btn" type="button" data-action="close-dialog">Cancel</button><button class="btn btn-primary" type="submit">${esc(o.submit || 'Save')}</button></div>`;
  f.innerHTML = `<div class="sheet-head"><div class="sheet-title">${esc(o.title)}</div>

}

/* ---------- add / edit an entry ---------- */
let ef = null;
function openEntry(id) {
  const t = id ? S.transactions.find(x => x.id === id) : null;
  if (id && !t) return;
  if (t && (t.billKey || t.loanId)) return openLinkedTx(t);
  const last = S.settings.lastAccount && acctById(S.settings.lastAccount) ? S.settings.lastAccount : S.accounts[0].id;
  ef = {
    id: t ? t.id : null, created: t ? t.created : null,
    type: t ? t.type : 'expense',
    categoryId: t ? (t.categoryId || '') : '',
    payMethod: t ? (t.payMethod || 'upi') : 'upi',
    cardId: t ? (t.cardId || '') : (S.cards[0] ? S.cards[0].id : ''),
    accountId: t ? (t.accountId || last) : last,
    toAccountId: t ? (t.toAccountId || '') : ''
  };
  drawEntry({ amount: t ? t.amount : '', date: t ? t.date : today(), note: t ? (t.note || '') : '' });
  showDialog($('#entryDialog'));
  setTimeout(() => { const a = $('#ef-amount'); if (a) a.focus(); }, 30);
}
function readEntry() {
  const f = $('#entryForm');
  const v = { amount: val(f, 'amount'), date: val(f, 'date'), note: val(f, 'note') };
  const a = f.elements.namedItem('account'); if (a) ef.accountId = a.value;
  const c = f.elements.namedItem('card'); if (c) ef.cardId = c.value;
  const to = f.elements.namedItem('toaccount'); if (to) ef.toAccountId = to.value;
  return v;
}
function drawEntry(v) {
  const isT = ef.type === 'transfer', isE = ef.type === 'expense';
  if (isT && (!ef.toAccountId || ef.toAccountId === ef.accountId)) {
    const other = S.accounts.find(a => a.id !== ef.accountId);
    ef.toAccountId = other ? other.id : '';
  }
  const cats = S.categories.filter(c => c.kind === (isE ? 'expense' : 'income'));
  const catChips = cats.map(c =>
    `<button type="button" class="catbtn" data-ecat="${c.id}" aria-pressed="${ef.categoryId === c.id}">${esc(c.name)}</button>`).join('');
  const payChips = PAY_METHODS.map(p =>
    `<button type="button" class="catbtn" data-epay="${p.id}" aria-pressed="${ef.payMethod === p.id}">${p.label}</button>`).join('');
  const typeBtn = (t, l) => `<button type="button" data-etype="${t}" data-type="${t}" aria-pressed="${ef.type === t}">${l}</button>`;

  let where = '';
  if (isT) {
    where = `<div class="frow-2">
      ${fld('ef-from', 'From', `<select class="inp" id="ef-from" name="account">${acctOptions(ef.accountId)}</select>`)}
      ${fld('ef-to', 'To', `<select class="inp" id="ef-to" name="toaccount">${acctOptions(ef.toAccountId)}</select>`)}
    </div>`;
  } else if (isE && ef.payMethod === 'card') {
    where = S.cards.length
      ? fld('ef-card', 'Which card', `<select class="inp" id="ef-card" name="card">${S.cards.map(c => `<option value="${c.id}" ${c.id === ef.cardId ? 'selected' : ''}>${esc(c.name)}${c.last4 ? ' ••' + esc(c.last4) : ''}</option>`).join('')}</select>`,
        'Goes onto that card’s next statement; no account balance changes until you pay the bill.')
      : `<div class="frow"><div class="hint">You haven’t added a credit card yet. Add one in the Cards tab, or choose another payment method.</div></div>`;
  } else {
    where = fld('ef-acct', isE ? 'Paid from' : 'Received in', `<select class="inp" id="ef-acct" name="account">${acctOptions(ef.accountId)}</select>`);
  }

  $('#entryForm').innerHTML = `
    <div class="sheet-head">
      <div class="sheet-title">${ef.id ? 'Edit entry' : 'Add entry'}</div>
      <button type="button" class="btn btn-ghost btn-sm" data-action="close-dialog" aria-label="Close">✕</button>
    </div>
    <div class="sheet-body">
      <div class="frow"><div class="seg" role="group" aria-label="Entry type">${typeBtn('expense', 'Expense')}${typeBtn('income', 'Income')}${typeBtn('transfer', 'Transfer')}</div></div>
      <div class="frow-2">
        ${fld('ef-amount', 'Amount (₹)', `<input class="inp amount" id="ef-amount" name="amount" type="number" inputmode="decimal" step="any" min="0" placeholder="0" value="${esc(v.amount)}" autocomplete="off" required>`)}
        ${fld('ef-date', 'Date', `<input class="inp" id="ef-date" name="date" type="date" value="${esc(v.date)}" required>`)}
      </div>
      ${isT ? '' : `<div class="frow"><label class="fl">Category</label><div class="chips">${catChips}</div></div>`}
      ${isE ? `<div class="frow"><label class="fl">Paid by</label><div class="chips">${payChips}</div></div>` : ''}
      ${where}
      ${fld('ef-note', 'Note (optional)', `<input class="inp" id="ef-note" name="note" type="text" maxlength="120" placeholder="${isT ? 'e.g. cash withdrawal' : 'e.g. vegetables from the market'}" value="${esc(v.note)}" autocomplete="off">`)}
    </div>
    <div class="sheet-foot">
      ${ef.id ? '<button type="button" class="btn btn-danger spacer" data-action="delete-tx">Delete</button>' : ''}
      <button type="button" class="btn" data-action="close-dialog">Cancel</button>
      <button type="submit" class="btn btn-primary">${ef.id ? 'Save changes' : 'Save entry'}</button>
    </div>`;
}
function saveEntry() {
  const v = readEntry();
  const amount = r2(parseFloat(v.amount));
  if (!(amount > 0)) return toast('Enter an amount greater than zero.');
  if (!/^\d{4}-\d{2}-\d{2}$/.test(v.date)) return toast('Pick a date.');
  const tx = { id: ef.id || uid(), type: ef.type, date: v.date, amount, note: v.note.trim(), created: ef.created || Date.now() };
  if (ef.type === 'transfer') {
    if (!ef.accountId || !ef.toAccountId || ef.accountId === ef.toAccountId) return toast('Choose two different accounts.');
    tx.accountId = ef.accountId; tx.toAccountId = ef.toAccountId;
  } else {
    if (!ef.categoryId) return toast('Pick a category.');
    tx.categoryId = ef.categoryId;
    if (ef.type === 'expense') {
      tx.payMethod = ef.payMethod;
      if (ef.payMethod === 'card') {
        if (!ef.cardId) return toast('Add a credit card in the Cards tab first, or pick another method.');
        tx.cardId = ef.cardId;
      } else tx.accountId = ef.accountId;
    } else tx.accountId = ef.accountId;
  }
  if (tx.accountId) S.settings.lastAccount = tx.accountId;
  const i = S.transactions.findIndex(x => x.id === tx.id);
  if (i >= 0) S.transactions[i] = tx; else S.transactions.push(tx);
  const moved = ymOf(tx.date) !== S.settings.ym;
  if (moved) S.settings.ym = ymOf(tx.date);
  save(); closeDialog($('#entryDialog')); renderAll();
  toast((ef.id ? 'Entry updated' : 'Entry saved') + (moved ? ' — showing ' + monthLabel(S.settings.ym) : ''));
}
function deleteTx(id) {
  const t = S.transactions.find(x => x.id === id);
  if (!t) return;
  S.transactions = S.transactions.filter(x => x.id !== id);
  for (const l of S.loans) {
    l.payments = (l.payments || []).filter(p => p.txId !== id);
    l.prepayments = (l.prepayments || []).filter(p => p.txId !== id);
  }
  save(); renderAll(); toast('Entry deleted');
}
function openLinkedTx(t) {
  const kind = t.billKey ? 'card bill payment' : t.loanKind === 'prepay' ? 'loan prepayment' : 'EMI payment';
  openAux({
    title: 'Payment entry',
    body: `<div class="srow"><div class="k">${esc(transferLabel(t))}</div><div class="v">${money(t.amount)}</div></div>
      <div class="srow"><div class="k">Date</div><div class="v" style="font-size:14px">${fmtDayFull(t.date)}</div></div>
      <p class="hint" style="margin-top:12px">This was recorded when you marked a ${kind} as paid. To change it, delete it and mark the payment again.</p>`,
    foot: `<div class="sheet-foot"><button class="btn btn-danger spacer" type="button" data-action="delete-linked" data-id="${t.id}">Delete payment</button><button class="btn btn-primary" type="button" data-action="close-dialog">Close</button></div>`
  });
}

/* ---------- categories ---------- */
const TINTS = ['#2B4EA2', '#1C6B4A', '#9C6B0E', '#7A4E8C', '#A63D2F', '#0E7C86', '#B0578D', '#C05C3E', '#3F6B4A', '#6B4E9C', '#4A6FA5', '#8A6A3B'];
function openCategory() {
  openAux({
    title: 'New category',
    body: `${fld('nc-name', 'Name', '<input class="inp" id="nc-name" name="cname" type="text" maxlength="30" data-first placeholder="e.g. Pets" autocomplete="off" required>')}

        ${fld('nc-kind', 'Type', '<select class="inp" id="nc-kind" name="ckind"><option value="expense">Expense</option><option value="income">Income</option></select>')}

      <div class="frow-2">

      </div>
      ${fld('ln-e', 'EMI (₹) — leave blank to calculate', `<input class="inp" id="ln-e" name="emi" type="number" min="0" step="any" value="${v.emi || ''}">`)}
      <div class="hint" id="loanHint" style="min-height:18px"></div>`,
    extraFoot: l ? `<button class="btn btn-danger spacer" type="button" data-action="delete-loan" data-id="${l.id}">Delete</button>` : '',
    onInput: () => {

      const P = Number(val(f, 'principal')), r = Number(val(f, 'rate')), n = Math.round(Number(val(f, 'tenure')));
      const el = $('#loanHint'), emiEl = f.elements.namedItem('emi');

        el.textContent = 'EMI ' + money(emi) + ' · total interest ' + money(s.totalInterest) + ' · you repay ' + money(s.totalPayable);
      } else el.textContent = '';

function exportCSV() {
  const q = s => '"' + String(s == null ? '' : s).replace(/"/g, '""') + '"';
  const lines = [['Date', 'Type', 'Category', 'Amount', 'Account / card', 'Method', 'Note'].join(',')];
  for (const t of [...S.transactions].sort((a, b) => a.date < b.date ? -1 : 1)) {
    const where = t.type === 'transfer' ? transferLabel(t) : (t.cardId ? ((cardById(t.cardId) || {}).name || 'Card') : acctName(t.accountId));
    lines.push([t.date, t.type, t.type === 'transfer' ? '' : catName(t), t.amount, where, payLabel(t.payMethod), t.note || ''].map(q).join(','));
  }
  downloadFile('expense-tracker-entries-' + today() + '.csv', '\ufeff' + lines.join('\r\n'), 'text/csv;charset=utf-8');
}
function loadSample() {
  S = blankState(); S.settings.onboarded = true;
  const now = new Date(), ym0 = today().slice(0, 7), dayNow = now.getDate();
  const cat = n => S.categories.find(c => c.name === n).id;
  const bank = S.accounts[0].id, cash = S.accounts[1].id;
  S.accounts[0].opening = 20000; S.accounts[1].opening = 1500;
  const card = { id: uid(), name: 'Everyday card', last4: '4821', limit: 50000, statementDay: 12, dueDay: 1 };
  S.cards.push(card);
  const startDate = iso(new Date(addMonthsLocal(now, -8).getFullYear(), addMonthsLocal(now, -8).getMonth(), 5, 12));
  S.loans.push({ id: uid(), name: 'Bike loan', lender: 'State Bank', principal: 60000, rate: 11.5, tenure: 36, emi: 0, startDate, payments: [], prepayments: [] });
  const plan = [
    [3, 'Vegetables & fruit', 320, 'Sabzi mandi', 'cash'], [4, 'Transport & fuel', 700, 'Petrol', 'upi'],
    [6, 'Eating out', 450, 'Dinner with family', 'card'], [7, 'Groceries', 1100, 'Online order', 'card'],
    [8, 'Household help', 350, 'Maid', 'cash'], [9, 'Eating out', 600, 'Weekend lunch', 'card'],
    [10, 'Medical', 280, 'Pharmacy', 'upi'], [11, 'Shopping', 1400, 'Shoes', 'card'],
    [12, 'Vegetables & fruit', 260, '', 'cash'], [13, 'Eating out', 420, 'Food delivery', 'card'],
    [14, 'Entertainment', 350, 'Movie', 'card'], [15, 'Transport & fuel', 650, 'Petrol', 'upi'],
    [16, 'Groceries', 950, 'Kirana', 'upi'], [17, 'Eating out', 500, 'Birthday treat', 'card'],
    [18, 'Eating out', 300, '', 'upi'], [19, 'Unplanned', 600, 'Repair work', 'cash'],
    [21, 'Groceries', 1050, '', 'upi'], [23, 'Vegetables & fruit', 300, '', 'cash'],
    [25, 'Transport & fuel', 600, 'Petrol', 'upi'], [27, 'Eating out', 350, '', 'upi']
  ];
  let n = 0;
  const push = (ym, day, type, catName, amount, note, method) => {
    const date = ym + '-' + String(day).padStart(2, '0');
    const tx = { id: uid(), type, date, amount, categoryId: cat(catName), note, created: Date.now() + (n++) };
    if (type === 'expense') { tx.payMethod = method; if (method === 'card') tx.cardId = card.id; else tx.accountId = method === 'cash' ? cash : bank; }
    else tx.accountId = bank;
    S.transactions.push(tx);
  };
  for (const ym of [ymShift(ym0, -1), ym0]) {
    const cur = ym === ym0, lim = cur ? dayNow : 31;
    const fixed = [[1, 'Salary', 40000, '', null, 'income'], [2, 'Rent', 9000, 'Monthly rent', 'netbanking', 'expense'],

    for (const [d, c, a, note, m, type] of fixed) if (d <= lim) push(ym, d, type, c, a, note, m);
    for (const [d, c, a, note, m] of plan) if (d <= lim) push(ym, d, 'expense', c, a, note, m);
  }
  save(); renderAll();
}

/* ---------- render coordination ---------- */
let activeView = 'overview';
const RENDER = { overview: renderOverview, transactions: renderTransactions, budgets: renderBudgets, loans: renderLoans, cards: renderCards };
function renderWelcome() {
  const el = $('#welcome'); if (!el) return;
  const show = !S.settings.onboarded && !S.transactions.length && !S.loans.length && !S.cards.length;
  el.innerHTML = show ? `<div class="callout"><div><strong>Welcome to Expense Tracker.</strong> Your entries stay on this device — nothing is uploaded. Add your first entry, set limits in Budgets, then add any loans and credit cards so due dates show up on the Overview.
    <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-sm btn-primary" type="button" data-action="add">Add an entry</button><button class="btn btn-sm" type="button" data-action="load-sample">Look around with sample data</button></div></div>
    <button class="close" type="button" data-action="dismiss-welcome" aria-label="Dismiss">✕</button></div>` : '';
}
function renderAll() {
  $('#monthLabel').textContent = monthLabel(S.settings.ym);
  renderWelcome();
  RENDER[activeView]();
}
function setView(v) {
  activeView = v;
  $$('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.view === v ? 'true' : 'false'));
  $$('.view').forEach(s => s.classList.toggle('active', s.id === 'view-' + v));
  renderAll();
  window.scrollTo(0, 0);
}

/* ---------- actions ---------- */
function handleAction(a, el) {
  switch (a) {
    case 'prev-month': S.settings.ym = ymShift(S.settings.ym, -1); save(); renderAll(); break;
    case 'next-month': S.settings.ym = ymShift(S.settings.ym, 1); save(); renderAll(); break;
    case 'this-month': S.settings.ym = today().slice(0, 7); save(); renderAll(); break;
    case 'goto': setView(el.dataset.view); break;
    case 'add': closeDialog($('#auxDialog')); openEntry(); break;
    case 'edit-tx': openEntry(el.dataset.id); break;
    case 'clear-filters': txFilter = { q: '', type: 'all', cat: 'all' }; renderTransactions(); break;
    case 'close-dialog': { const d = el.closest('dialog'); if (d) closeDialog(d); break; }
    case 'delete-tx':
      if (ef && ef.id && confirm('Delete this entry?')) { deleteTx(ef.id); closeDialog($('#entryDialog')); }
      break;
    case 'delete-linked':
      if (confirm('Delete this payment? The bill or EMI will show as unpaid again.')) { deleteTx(el.dataset.id); closeDialog($('#auxDialog')); }
      break;
    case 'new-category': openCategory(); break;
    case 'new-loan': openLoan(); break;
    case 'edit-loan': openLoan(el.dataset.id); break;
    case 'pay-emi': openPayEmi(el.dataset.id); break;
    case 'prepay': openPrepay(el.dataset.id); break;
    case 'schedule': openSchedule(el.dataset.id); break;
    case 'delete-loan': {
      const l = loanById(el.dataset.id);
      if (l && confirm('Delete “' + l.name + '”? Payments you already recorded stay in your entries.')) {
        S.loans = S.loans.filter(x => x.id !== l.id); save(); closeDialog($('#auxDialog')); renderAll(); toast('Loan deleted');
      }
      break;
    }
    case 'new-card': openCard(); break;
    case 'edit-card': openCard(el.dataset.id); break;
    case 'pay-card': openPayCard(el.dataset.id); break;
    case 'delete-card': {
      const c = cardById(el.dataset.id);
      if (c && confirm('Delete “' + c.name + '”? Entries made with it stay in your history.')) {
        S.cards = S.cards.filter(x => x.id !== c.id); save(); closeDialog($('#auxDialog')); renderAll(); toast('Card deleted');
      }
      break;
    }
    case 'fit-budgets': {
      const sal = Number(S.settings.salary) || 0, cap = sal - r2(sal * (Number(S.settings.savingsPct) || 0) / 100), bt = budgetTotal();
      if (!(cap > 0) || !(bt > 0)) break;
      const f = cap / bt;
      for (const c of S.categories) if (c.kind === 'expense' && c.budget > 0) c.budget = Math.max(0, Math.round(c.budget * f / 100) * 100);
      save(); renderAll(); toast('Limits rescaled to fit your salary plan'); break;
    }
    case 'open-data': openData(); break;
    case 'add-account': {
      const inp = $('#newAcct'), name = inp ? inp.value.trim() : '';
      if (!name) { toast('Type a name for the account.'); break; }
      S.accounts.push({ id: uid(), name, type: 'bank', opening: 0 }); save(); openData(); renderAll();
      break;
    }
    case 'export-json': downloadFile('expense-tracker-backup-' + today() + '.json', JSON.stringify(S, null, 2), 'application/json'); toast('Backup downloaded'); break;
    case 'export-csv': exportCSV(); toast('CSV downloaded'); break;
    case 'restore': { const fi = $('#restoreFile'); if (fi) fi.click(); break; }
    case 'load-sample':
      if (!S.transactions.length && !S.loans.length && !S.cards.length || confirm('Replace everything with sample data? Your current entries will be lost.')) {
        loadSample(); closeDialog($('#auxDialog')); toast('Sample data loaded — erase it any time from Data');
      }
      break;
    case 'erase-all':
      if (confirm('Erase every entry, loan, card and budget on this device? This cannot be undone.')) {
        S = blankState(); S.settings.onboarded = true; save(); closeDialog($('#auxDialog')); renderAll(); toast('All data erased');
      }
      break;
    case 'dismiss-welcome': S.settings.onboarded = true; save(); renderWelcome(); break;
  }
}

/* ---------- boot ---------- */
function init() {
  S = load();
  S.settings.ym = today().slice(0, 7);
  for (const c of S.categories) { const s = SEED_CATS.find(x => x.name === c.name); if (s) c.tint = s.tint; }
  $('main').insertAdjacentHTML('afterbegin', '<div id="welcome"></div>');
  const lbl = $('#monthLabel');
  lbl.dataset.action = 'this-month'; lbl.title = 'Jump to this month'; lbl.style.cursor = 'pointer';

  document.addEventListener('click', e => {
    const tab = e.target.closest('.tab');
    if (tab) { setView(tab.dataset.view); return; }
    const et = e.target.closest('[data-etype]');
    if (et && ef) { const v = readEntry(); const wasExp = ef.type === 'expense'; ef.type = et.dataset.etype; if ((ef.type === 'expense') !== wasExp || ef.type === 'transfer') ef.categoryId = ''; drawEntry(v); return; }
    const ec = e.target.closest('[data-ecat]');
    if (ec && ef) { ef.categoryId = ec.dataset.ecat; $$('[data-ecat]').forEach(b => b.setAttribute('aria-pressed', String(b === ec))); return; }
    const ep = e.target.closest('[data-epay]');
    if (ep && ef) { const v = readEntry(); ef.payMethod = ep.dataset.epay; drawEntry(v); return; }
    const el = e.target.closest('[data-action]');
    if (el) handleAction(el.dataset.action, el);
  });

  $('#entryForm').addEventListener('submit', e => { e.preventDefault(); saveEntry(); });
  const aux = $('#auxForm');
  aux.addEventListener('submit', e => {
    e.preventDefault();
    if (auxSubmit && auxSubmit(aux) !== false) closeDialog($('#auxDialog'));
  });
  aux.addEventListener('input', () => { if (auxInput) auxInput(); });
  aux.addEventListener('change', e => {
    const t = e.target;
    if (t.dataset && t.dataset.openFor) {
      const a = acctById(t.dataset.openFor); if (!a) return;
      a.opening = r2(Number(t.value) || 0); save();
      const b = $('#bal-' + a.id); if (b) b.textContent = money(accountBalance(a.id, today()));
      renderAll();
    } else if (t.id === 'restoreFile' && t.files && t.files[0]) {
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const p = JSON.parse(reader.result);
          if (!p || !Array.isArray(p.transactions)) throw new Error('not a Expense Tracker backup');
          if (!confirm('Replace everything on this device with the backup (' + p.transactions.length + ' entries)?')) return;
          S = normalizeState(p); S.settings.ym = today().slice(0, 7); S.settings.onboarded = true;
          save(); closeDialog($('#auxDialog')); renderAll(); toast('Backup restored');
        } catch (err) { toast('That file is not a valid Expense Tracker backup.'); }
      };
      reader.readAsText(t.files[0]);
    }
  });
  for (const d of $$('dialog')) d.addEventListener('click', e => { if (e.target === d) closeDialog(d); });

  document.addEventListener('keydown', e => {
    if (e.key !== 'n' || e.metaKey || e.ctrlKey || e.altKey) return;
    if (/INPUT|TEXTAREA|SELECT/.test((document.activeElement || {}).tagName || '') || document.querySelector('dialog[open]')) return;
    e.preventDefault(); openEntry();
  });
  window.addEventListener('pagehide', () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (err) { /* ignore */ } });

  renderAll();
}
init();

</script>
</body>
