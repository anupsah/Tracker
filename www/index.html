<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F2A4A">
<title>Expense Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F6F9;
  --card:#FFFFFF;
  --ink:#0F172A;
  --ink-soft:#475569;
  --ink-faint:#64748B;
  --rule:#E2E8F0;
  --rule-strong:#CBD5E1;
  --navy:#0F2A4A;
  --blue:#1E40AF;
  --violet:#334155;
  --teal:#0F766E;
  --green:#15803D;
  --red:#B91C1C;
  --ochre:#B45309;
  --green-tint:#DCFCE7;
  --red-tint:#FEE2E2;
  --ochre-tint:#FEF3C7;
  --blue-tint:#DBEAFE;
  --r:6px;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-weight:500;line-height:1.2}
p{margin:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.015em}
.serif{font-family:var(--serif)}
.tiny{font-size:12px;color:var(--ink-faint)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:2px}
::selection{background:#CFE0FA}

/* ---------- app frame ---------- */
.wrap{max-width:1140px;margin:0 auto;padding:0 20px}
.topbar{position:sticky;top:0;z-index:30;background:rgba(247,247,243,.94);backdrop-filter:saturate(1.2) blur(10px);border-bottom:1px solid var(--rule)}
.topbar-in{max-width:1140px;margin:0 auto;padding:10px 20px 0;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.brand{display:flex;align-items:center;gap:11px;margin-right:auto;min-width:0}
.brand-mark{
  width:32px;height:32px;flex:none;border:1.5px solid var(--navy);border-radius:2px;
  display:grid;place-items:center;font-family:var(--serif);font-size:19px;color:var(--navy);
  box-shadow:inset 0 0 0 2px #fff, inset 0 0 0 3px rgba(27,42,74,.25);
}
.brand-name{font-family:var(--serif);font-size:20px;letter-spacing:.005em;line-height:1}
.brand-sub{font-size:11px;color:var(--ink-faint);letter-spacing:.04em;margin-top:2px}
.topbar-actions{display:flex;align-items:center;gap:8px}

.monthnav{display:flex;align-items:center;gap:2px;border:1px solid var(--rule-strong);border-radius:var(--r);background:#fff}
.monthnav button{background:none;border:0;padding:6px 10px;cursor:pointer;color:var(--ink-soft);line-height:1;font-size:16px}
.monthnav button:hover{background:#EEF2F7;color:var(--ink)}
.monthnav .label{font-family:var(--serif);font-size:16px;padding:0 6px;min-width:132px;text-align:center;white-space:nowrap}

.btn{
  display:inline-flex;align-items:center;gap:7px;border:1px solid var(--rule-strong);background:#fff;
  color:var(--ink);padding:7px 13px;border-radius:var(--r);cursor:pointer;font-size:14px;font-weight:500;
  transition:background .12s ease,border-color .12s ease;
}
.btn:hover{background:#EEF2F7;border-color:var(--ink-faint)}
.btn-primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn-primary:hover{background:#24365D;border-color:#24365D}
.btn-ghost{border-color:transparent;background:transparent;color:var(--ink-soft)}
.btn-ghost:hover{background:#EDF1F6;color:var(--ink)}
.btn-sm{padding:4px 9px;font-size:13px}
.btn-danger{color:var(--red);border-color:#E0C4BE}
.btn-danger:hover{background:var(--red-tint)}

.tabs{display:flex;gap:2px;max-width:1140px;margin:0 auto;padding:6px 20px 0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  border:0;background:none;padding:9px 13px 10px;cursor:pointer;color:var(--ink-soft);
  font-size:14px;font-weight:500;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px;
}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--navy);border-bottom-color:var(--navy)}

main{padding:26px 0 96px}
.view{display:none}
.view.active{display:block}

/* ---------- generic blocks ---------- */
.panel{background:var(--card);border:1px solid var(--rule);border-radius:var(--r)}
.panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:16px 18px 12px;border-bottom:1px solid var(--rule)}
.panel-title{font-family:var(--serif);font-size:18px;font-weight:500}
.panel-body{padding:16px 18px}
.panel-foot{padding:12px 18px;border-top:1px solid var(--rule);background:#F8FAFC;border-radius:0 0 var(--r) var(--r)}

.grid{display:grid;gap:18px}
.grid-main{grid-template-columns:minmax(0,1.12fr) minmax(0,.88fr)}
.grid-half{grid-template-columns:1fr 1fr}
@media(max-width:900px){.grid-main,.grid-half{grid-template-columns:1fr}}

.section-title{font-family:var(--serif);font-size:22px;margin:0 0 4px}
.section-note{color:var(--ink-soft);font-size:13.5px;max-width:60ch}
.view-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:18px}

/* ---------- statement slip ---------- */
.slip{background:#fff;border:1px solid var(--rule-strong);border-radius:var(--r);overflow:hidden;box-shadow:0 1px 0 rgba(21,22,26,.03),0 18px 38px -34px rgba(21,22,26,.6)}
.slip-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:15px 20px 13px;border-bottom:1px solid var(--ink)}
.slip-head .t{font-family:var(--serif);font-size:17px}
.slip-head .m{font-family:var(--mono);font-size:11px;color:var(--ink-faint);letter-spacing:.03em;text-transform:uppercase}
.slip-rows{padding:2px 20px 0}
.srow{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:11px 0;border-bottom:1px solid #E8ECF2}
.srow:last-child{border-bottom:0}
.srow .k{color:var(--ink-soft);display:flex;align-items:center;gap:8px}
.srow .v{font-family:var(--mono);font-size:16px;font-variant-numeric:tabular-nums}
.srow .v.pos{color:var(--green)}
.srow .v.neg{color:var(--red)}
.srow.total{border-bottom:0;border-top:3px double var(--ink);margin-top:2px;padding:14px 0 15px}
.srow.total .k{color:var(--ink);font-weight:500;font-size:15px}
.srow.total .v{font-size:27px;font-weight:500;letter-spacing:-.02em}
.dotkey{width:7px;height:7px;border-radius:50%;flex:none}
.dotkey.in{background:var(--green)}
.dotkey.out{background:var(--red)}

.slip-foot{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--rule);background:#F1F5F9}
.sfcell{padding:11px 14px;border-right:1px solid var(--rule)}
.sfcell:last-child{border-right:0}
.sfcell .l{font-size:11px;color:var(--ink-faint);letter-spacing:.03em;text-transform:uppercase;margin-bottom:3px}
.sfcell .n{font-family:var(--mono);font-size:14.5px;font-variant-numeric:tabular-nums}
@media(max-width:520px){.slip-foot{grid-template-columns:1fr 1fr}.sfcell:nth-child(2){border-right:0}.sfcell:nth-child(3){grid-column:1/-1;border-top:1px solid var(--rule)}}

/* ---------- pace bar ---------- */
.pace{display:flex;align-items:center;gap:10px;margin-top:14px}
.pace-track{position:relative;flex:1;height:7px;background:#E2E8F0;border-radius:0}
.pace-fill{position:absolute;inset:0 auto 0 0;background:var(--navy);transition:width .35s ease}
.pace-fill.warn{background:var(--ochre)}
.pace-fill.over{background:var(--red)}
.pace-mark{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55}
.pace-label{font-size:11.5px;color:var(--ink-faint);white-space:nowrap;font-variant-numeric:tabular-nums}

/* ---------- notes / suggestions ---------- */
.notes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.note{display:flex;gap:11px;padding:12px 0;border-bottom:1px solid #E8ECF2;font-size:14px;line-height:1.45}
.note:last-child{border-bottom:0}
.note:first-child{padding-top:2px}
.note .ico{flex:none;width:16px;height:16px;margin-top:2px}
.note.over .ico{color:var(--red)}
.note.warn .ico{color:var(--ochre)}
.note.ok .ico{color:var(--green)}
.note.info .ico{color:var(--blue)}
.note strong{font-weight:600}
.note .amt{font-family:var(--mono);font-weight:500;font-variant-numeric:tabular-nums}
.empty-note{padding:18px 0;color:var(--ink-soft);font-size:14px}

/* ---------- dues ---------- */
.dues{display:flex;flex-direction:column}
.due{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:13px;padding:11px 0;border-bottom:1px solid #E8ECF2}
.due:last-child{border-bottom:0}
.due-date{border:1px solid var(--rule-strong);border-radius:2px;text-align:center;padding:3px 0 2px;background:#F8FAFC}
.due-date .d{font-family:var(--mono);font-size:15px;line-height:1.1;font-variant-numeric:tabular-nums}
.due-date .mo{font-size:9.5px;letter-spacing:.07em;color:var(--ink-faint);text-transform:uppercase}
.due-name{font-weight:500;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.due-meta{font-size:12px;color:var(--ink-faint)}
.due-amt{font-family:var(--mono);font-size:14.5px;font-variant-numeric:tabular-nums;text-align:right}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;padding:2px 7px;border-radius:2px;white-space:nowrap;letter-spacing:.01em}
.chip.due-soon{background:var(--ochre-tint);color:var(--ochre)}
.chip.due-urgent{background:var(--red-tint);color:var(--red)}
.chip.due-ok{background:var(--blue-tint);color:var(--blue)}
.chip.due-paid{background:var(--green-tint);color:var(--green)}
.chip.plain{background:#EDF1F6;color:var(--ink-soft)}

/* ---------- budget meters ---------- */
.bmeter{display:grid;grid-template-columns:minmax(96px,1.05fr) minmax(0,2fr) auto;gap:14px;align-items:center;padding:9px 0;border-bottom:1px solid #E8ECF2}
.bmeter:last-child{border-bottom:0}
.bm-name{font-size:14px;display:flex;align-items:center;gap:7px;min-width:0}
.bm-name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bm-bar{position:relative;height:8px;background:#E2E8F0;border-radius:1px;overflow:visible}
.bm-fill{position:absolute;inset:0 auto 0 0;background:var(--navy);border-radius:1px;transition:width .3s ease}
.bm-fill.warn{background:var(--ochre)}
.bm-fill.over{background:var(--red)}
.bm-pace{position:absolute;top:-4px;bottom:-4px;width:1.5px;background:rgba(21,22,26,.45)}
.bm-num{font-family:var(--mono);font-size:13px;text-align:right;min-width:104px;font-variant-numeric:tabular-nums}
.bm-num .sub{display:block;font-size:11px;color:var(--ink-faint);font-family:var(--sans)}
.bm-num .over{color:var(--red)}

/* ---------- tables / rows ---------- */
.txlist{display:flex;flex-direction:column}
.tx{display:grid;grid-template-columns:64px minmax(0,1fr) 128px 110px;gap:12px;align-items:center;padding:10px 18px;border-bottom:1px solid #E8ECF2;cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%;font:inherit}
.tx:hover{background:#F8FAFC}
.tx:last-child{border-bottom:0}
.tx-date{font-family:var(--mono);font-size:12px;color:var(--ink-faint);font-variant-numeric:tabular-nums}
.tx-main{min-width:0}
.tx-title{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx-sub{font-size:11.5px;color:var(--ink-faint);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx-cat{font-size:12.5px;color:var(--ink-soft);display:flex;align-items:center;gap:6px;overflow:hidden}
.tx-amt{font-family:var(--mono);font-size:14px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tx-amt.out{color:var(--ink)}
.tx-amt.in{color:var(--green)}
.tx-amt.move{color:var(--ink-faint)}
@media(max-width:760px){
  .tx{grid-template-columns:52px minmax(0,1fr) auto;gap:10px;padding:10px 14px}
  .tx-cat{display:none}
}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--rule);background:#F8FAFC}
.field{border:1px solid var(--rule-strong);background:#fff;border-radius:var(--r);padding:6px 10px;font-size:13.5px;min-width:0}
.field:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px rgba(30,64,175,.16)}
.search{flex:1;min-width:150px}
.sel{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-soft) 50%),linear-gradient(135deg,var(--ink-soft) 50%,transparent 50%);background-position:calc(100% - 14px) 52%,calc(100% - 9px) 52%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:28px}

/* ---------- loans & cards ---------- */
.inst{background:#fff;border:1px solid var(--rule);border-radius:var(--r);padding:18px}
.inst-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.inst-name{font-family:var(--serif);font-size:19px}
.inst-sub{font-size:12px;color:var(--ink-faint);margin-top:3px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px;margin-top:16px}
.kv .k{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:3px}
.kv .v{font-family:var(--mono);font-size:14.5px;font-variant-numeric:tabular-nums}
.card-face{position:relative;border-radius:10px;padding:18px;color:#fff;background:linear-gradient(150deg,#1B2A4A 0%,#2C3F6B 62%,#3A4F80 100%);overflow:hidden}
.card-face::after{content:"";position:absolute;right:-60px;top:-70px;width:190px;height:190px;border:1px solid rgba(255,255,255,.14);border-radius:50%}
.card-face .cf-name{font-family:var(--serif);font-size:17px}
.card-face .cf-num{font-family:var(--mono);font-size:13px;letter-spacing:.14em;color:rgba(255,255,255,.72);margin-top:2px}
.card-face .cf-bal{font-family:var(--mono);font-size:26px;margin-top:22px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.card-face .cf-lbl{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.6)}
.util{position:relative;height:5px;background:rgba(255,255,255,.2);margin-top:14px;border-radius:1px}
.util i{position:absolute;inset:0 auto 0 0;background:#fff;border-radius:1px}
.util.high i{background:#F2B8AE}
.card-body{padding:16px 0 0}

/* ---------- modal ---------- */
dialog{border:0;padding:0;background:transparent;max-width:100vw;max-height:100vh}
dialog::backdrop{background:rgba(21,22,26,.42);backdrop-filter:blur(2px)}
.sheet{width:min(560px,calc(100vw - 28px));background:#fff;border-radius:6px;box-shadow:0 30px 80px -20px rgba(21,22,26,.55);overflow:hidden;margin:auto}
.sheet-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--rule)}
.sheet-title{font-family:var(--serif);font-size:19px}
.sheet-body{padding:18px 20px;max-height:min(72vh,640px);overflow:auto}
.sheet-foot{display:flex;gap:8px;justify-content:flex-end;align-items:center;padding:14px 20px;border-top:1px solid var(--rule);background:#F8FAFC}
.sheet-foot .spacer{margin-right:auto}
label.fl{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:5px;font-weight:500}
.frow{margin-bottom:14px}
.frow-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.inp{width:100%;border:1px solid var(--rule-strong);background:#fff;border-radius:var(--r);padding:9px 11px;font-size:14.5px}
.inp:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px rgba(30,64,175,.16)}
.inp.amount{font-family:var(--mono);font-size:22px;padding:8px 11px;letter-spacing:-.01em}
textarea.inp{resize:vertical;min-height:60px}
.seg{display:inline-flex;border:1px solid var(--rule-strong);border-radius:var(--r);overflow:hidden}
.seg button{border:0;background:#fff;padding:7px 16px;cursor:pointer;font-size:13.5px;font-weight:500;color:var(--ink-soft)}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
.seg button[aria-pressed="true"][data-type="income"]{background:var(--green)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.catbtn{border:1px solid var(--rule-strong);background:#fff;border-radius:2px;padding:5px 10px;font-size:13px;cursor:pointer;color:var(--ink-soft)}
.catbtn:hover{background:#EEF2F7}
.catbtn[aria-pressed="true"]{border-color:var(--navy);background:var(--navy);color:#fff}
.hint{font-size:12px;color:var(--ink-faint);margin-top:6px}

/* ---------- misc ---------- */
.statline{display:flex;flex-wrap:wrap;gap:22px;padding:14px 18px;border-top:1px solid var(--rule)}
.stat{min-width:0}
.stat .k{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-faint)}
.stat .v{font-family:var(--mono);font-size:16px;font-variant-numeric:tabular-nums;margin-top:2px}
.callout{display:flex;gap:12px;padding:13px 16px;border:1px solid #F6D48A;background:var(--ochre-tint);border-radius:var(--r);font-size:13.5px;color:#8A4B06;margin-bottom:18px}
.callout .close{margin-left:auto;background:none;border:0;cursor:pointer;color:inherit;opacity:.6;font-size:16px;line-height:1}
.callout .close:hover{opacity:1}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:3px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:100;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
.fab{position:fixed;right:18px;bottom:20px;z-index:25;display:none;box-shadow:0 10px 26px -8px rgba(27,42,74,.6)}
@media(max-width:640px){
  .fab{display:inline-flex}
  .topbar-actions .btn-primary{display:none}
  .brand-sub{display:none}
  main{padding:20px 0 88px}
  .wrap{padding:0 14px}
  .topbar-in{padding:10px 14px 0}
  .tabs{padding:4px 8px 0}
  .tab{padding:9px 11px 10px;font-size:13.5px}
}
@media(prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}

/* ---------- additions ---------- */
.sched{width:100%;border-collapse:collapse;font-size:13px}
.sched th{position:sticky;top:0;background:#F8FAFC;text-align:right;font-weight:500;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-faint);padding:8px 10px;border-bottom:1px solid var(--ink)}
.sched th:first-child,.sched th:nth-child(2),.sched td:first-child,.sched td:nth-child(2){text-align:left}
.sched td{padding:7px 10px;border-bottom:1px solid #E8ECF2;text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.sched td:nth-child(2){font-family:var(--sans)}
.sched tr.done td{color:var(--ink-faint);background:#F1F5F9}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.callout .btn{color:var(--ink)}.callout .btn-primary{color:#fff}
@media(max-width:700px){
  .bmeter[data-cat-row]{grid-template-columns:1fr 104px!important;gap:6px 12px}
  .bmeter[data-cat-row]>div:nth-child(1){order:1}
  .bmeter[data-cat-row]>div:nth-child(4){order:2}
  .bmeter[data-cat-row]>div:nth-child(2){order:3;grid-column:1/-1}
  .bmeter[data-cat-row]>div:nth-child(3){order:4;grid-column:1/-1;text-align:left}
  .frow-2{grid-template-columns:1fr}
  .kv{gap:12px}
}

/* ---------- professional theme ---------- */
body{background:var(--paper);font-feature-settings:"tnum" 1,"cv11" 1}
h1,h2,h3,h4{letter-spacing:-.01em}
.topbar{background:#0F2A4A;border-bottom:0;box-shadow:0 6px 18px -12px rgba(15,23,42,.55);backdrop-filter:none}
.brand-mark{border:0;border-radius:8px;background:#fff;color:#0F2A4A;font-weight:700;font-size:17px;box-shadow:none}
.brand-name{color:#fff;font-weight:600;font-size:18px;letter-spacing:-.01em}
.brand-sub{color:rgba(255,255,255,.62);letter-spacing:.02em}
.monthnav{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.22)}

<body>

<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">₹</div>
      <div>
        <div class="brand-name">Expense Tracker</div>
        <div class="brand-sub">Personal finance</div>
      </div>
    </div>

    <div class="monthnav" role="group" aria-label="Change month">
      <button type="button" data-action="prev-month" aria-label="Previous month">‹</button>
      <div class="label" id="monthLabel">—</div>
      <button type="button" data-action="next-month" aria-label="Next month">›</button>
    </div>

    <div class="topbar-actions">
      <button class="btn btn-ghost btn-sm" type="button" data-action="open-data" title="Backup, restore or clear data">Data</button>
      <button class="btn btn-primary" type="button" data-action="add">Add entry</button>
    </div>
  </div>

  <nav class="tabs" role="tablist" aria-label="Views">
    <button class="tab" role="tab" data-view="overview" aria-selected="true">Overview</button>
    <button class="tab" role="tab" data-view="transactions" aria-selected="false">Transactions</button>

</header>

<main class="wrap">

  <section id="view-transactions" class="view" role="tabpanel" aria-label="Transactions"></section>
  <section id="view-budgets" class="view" role="tabpanel" aria-label="Budgets"></section>

</main>

<button class="btn btn-primary fab" type="button" data-action="add" aria-label="Add entry">＋ Add</button>

<dialog id="entryDialog"><form id="entryForm" method="dialog" class="sheet"></form></dialog>
<dialog id="auxDialog"><form id="auxForm" method="dialog" class="sheet"></form></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ==========================================================================
   Expense Tracker — personal money ledger
   Everything lives in one file. Data is stored on this device only.
   ========================================================================== */

/* ---------- small utilities ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const r2 = n => Math.round((Number(n) + Number.EPSILON) * 100) / 100;
const clamp = (n, a, b) => Math.min(b, Math.max(a, n));
const sum = (a, f = x => x) => a.reduce((t, x) => t + Number(f(x) || 0), 0);

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

const INR = new Intl.NumberFormat('en-IN', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
const INR2 = new Intl.NumberFormat('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

/* ₹1,24,500 — drops paise when the amount is whole */
function money(n, opts = {}) {
  const v = Number(n || 0);
  const sign = v < 0 ? '−' : '';
  const a = Math.abs(v);
  const body = (opts.paise || Math.abs(a - Math.round(a)) > 0.004) ? INR2.format(a) : INR.format(a);
  return sign + '₹' + body;
}
/* ₹1.2L / ₹3.4Cr for tight spaces */
function moneyShort(n) {
  const v = Number(n || 0), sign = v < 0 ? '−' : '', a = Math.abs(v);
  if (a >= 1e7) return sign + '₹' + (a / 1e7).toFixed(a >= 1e8 ? 1 : 2).replace(/\.?0+$/, '') + 'Cr';
  if (a >= 1e5) return sign + '₹' + (a / 1e5).toFixed(a >= 1e6 ? 1 : 2).replace(/\.?0+$/, '') + 'L';
  if (a >= 1e3) return sign + '₹' + Math.round(a / 1e3) + 'k';
  return sign + '₹' + Math.round(a);
}
function pct(n) { return (Math.round(Number(n || 0) * 10) / 10) + '%'; }

/* ---------- dates (all local, ISO yyyy-mm-dd strings) ---------- */
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

function iso(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function parseISO(s) { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1, 12, 0, 0); }
function today() { return iso(new Date()); }
function daysInMonth(y, m) { return new Date(y, m + 1, 0).getDate(); }
function ymOf(s) { return String(s).slice(0, 7); }
function addDays(d, n) { const x = new Date(d.getTime()); x.setDate(x.getDate() + n); return x; }
function daysBetween(a, b) { return Math.round((parseISO(b) - parseISO(a)) / 86400000); }
function fmtDay(s) { const d = parseISO(s); return d.getDate() + ' ' + MON[d.getMonth()]; }
function fmtDayFull(s) { const d = parseISO(s); return DOW[d.getDay()] + ', ' + d.getDate() + ' ' + MON[d.getMonth()] + ' ' + d.getFullYear(); }
function monthLabel(ym) { const [y, m] = ym.split('-').map(Number); return MONTHS[m - 1] + ' ' + y; }
/* first and last date of a YYYY-MM */
function monthBounds(ym) {
  const [y, m] = ym.split('-').map(Number);
  return { start: ym + '-01', end: ym + '-' + String(daysInMonth(y, m - 1)).padStart(2, '0'), y, m0: m - 1, dim: daysInMonth(y, m - 1) };
}
/* next date on/after `from` whose day-of-month is `day` (clamped to short months) */
function nextOnDay(fromISO, day) {
  let d = parseISO(fromISO);
  const cand = new Date(d.getFullYear(), d.getMonth(), Math.min(day, daysInMonth(d.getFullYear(), d.getMonth())), 12);
  if (iso(cand) >= fromISO) return iso(cand);
  const y2 = d.getMonth() === 11 ? d.getFullYear() + 1 : d.getFullYear();
  const m2 = (d.getMonth() + 1) % 12;
  return iso(new Date(y2, m2, Math.min(day, daysInMonth(y2, m2)), 12));
}

/* ---------- seed data ---------- */
const SEED_CATS = [
  /* Needs — ₹22,000 */
  { name: 'Rent', tint: '#1E3A8A', kind: 'expense', budget: 9000 },
  { name: 'Groceries', tint: '#2563EB', kind: 'expense', budget: 4000 },
  { name: 'Vegetables & fruit', tint: '#16A34A', kind: 'expense', budget: 1500 },
  { name: 'Electricity', tint: '#D97706', kind: 'expense', budget: 1000 },
  { name: 'Mobile & internet', tint: '#0284C7', kind: 'expense', budget: 600 },
  { name: 'Transport & fuel', tint: '#475569', kind: 'expense', budget: 2500 },
  { name: 'Medical', tint: '#0D9488', kind: 'expense', budget: 1000 },
  { name: 'Household help', tint: '#B45309', kind: 'expense', budget: 700 },
  { name: 'Insurance', tint: '#15803D', kind: 'expense', budget: 1200 },
  { name: 'School & fees', tint: '#4F46E5', kind: 'expense', budget: 500 },
  /* Wants — ₹10,000 */
  { name: 'Eating out', tint: '#BE123C', kind: 'expense', budget: 3000 },
  { name: 'Shopping', tint: '#9D174D', kind: 'expense', budget: 2500 },
  { name: 'Entertainment', tint: '#7E22CE', kind: 'expense', budget: 1500 },
  { name: 'Subscriptions', tint: '#0891B2', kind: 'expense', budget: 700 },
  { name: 'Unplanned', tint: '#64748B', kind: 'expense', budget: 2300 },
  { name: 'Salary', tint: '#15803D', kind: 'income', budget: 0 },
  { name: 'Other income', tint: '#0E7490', kind: 'income', budget: 0 }
];
/* Re-size every expense limit to the salary plan (used once for data saved before the plan existed) */
function applyPlanBudgets(st) {
  for (const c of st.categories) {
    const sd = SEED_CATS.find(x => x.name === c.name);
    if (sd && c.kind === 'expense') c.budget = sd.budget;
  }
}
const SEED_ACCOUNTS = [
  { name: 'Bank account', type: 'bank' },
  { name: 'Cash in hand', type: 'cash' },
  { name: 'UPI wallet', type: 'wallet' }
];

/* ---------- state ---------- */
const KEY = 'khaata.v1';
let S = null;

function blankState() {
  return {
    v: 1,
    transactions: [],
    categories: SEED_CATS.map(c => ({ id: uid(), ...c })),
    accounts: SEED_ACCOUNTS.map(a => ({ id: uid(), ...a, opening: 0 })),
    loans: [],
    cards: [],
    settings: { ym: today().slice(0, 7), onboarded: false, salary: 40000, savingsPct: 20, planV: 2 }
  };
}
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return blankState();
    const p = JSON.parse(raw);
    if (!p || typeof p !== 'object') return blankState();
    const base = blankState();
    const needsPlan = !(p.settings && p.settings.planV);
    const out = {
      ...base, ...p,
      settings: { ...base.settings, ...(p.settings || {}) },
      categories: Array.isArray(p.categories) && p.categories.length ? p.categories : base.categories,
      accounts: Array.isArray(p.accounts) && p.accounts.length ? p.accounts : base.accounts,
      transactions: Array.isArray(p.transactions) ? p.transactions : [],
      loans: Array.isArray(p.loans) ? p.loans : [],
      cards: Array.isArray(p.cards) ? p.cards : []
    };
    if (needsPlan) { applyPlanBudgets(out); out.settings.planV = 2; }
    return out;
  } catch (e) {
    console.warn('Could not read saved data; starting fresh.', e);
    return blankState();
  }
}
let saveTimer = null;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(KEY, JSON.stringify(S)); }
    catch (e) { toast('Could not save — this browser may be blocking storage.'); }
  }, 120);
}

/* ---------- lookups ---------- */
const catById = id => S.categories.find(c => c.id === id);
const acctById = id => S.accounts.find(a => a.id === id);
const cardById = id => S.cards.find(c => c.id === id);
const loanById = id => S.loans.find(l => l.id === id);
function catName(t) {
  if (t.type === 'transfer') return 'Transfer';
  const c = catById(t.categoryId);
  return c ? c.name : 'Uncategorised';
}
function catTint(t) {
  if (t.type === 'transfer') return '#B4B7AB';
  const c = catById(t.categoryId);
  return c ? c.tint : '#8A8D83';
}
function acctName(id) { const a = acctById(id); return a ? a.name : '—'; }

const PAY_METHODS = [
  { id: 'upi', label: 'UPI' },
  { id: 'cash', label: 'Cash' },
  { id: 'card', label: 'Credit card' },
  { id: 'netbanking', label: 'Net banking' },
  { id: 'autodebit', label: 'Auto-debit' }
];
const payLabel = id => (PAY_METHODS.find(p => p.id === id) || {}).label || '';

/* ---------- transaction queries ---------- */
function txInMonth(ym) {
  return S.transactions.filter(t => ymOf(t.date) === ym).sort(sortTx);
}
function sortTx(a, b) { return a.date === b.date ? (a.created || 0) - (b.created || 0) : (a.date < b.date ? 1 : -1); }

function monthTotals(ym) {
  const list = txInMonth(ym);
  const income = sum(list.filter(t => t.type === 'income'), t => t.amount);
  const expense = sum(list.filter(t => t.type === 'expense'), t => t.amount);
  const transfers = sum(list.filter(t => t.type === 'transfer'), t => t.amount);
  return { list, income: r2(income), expense: r2(expense), transfers: r2(transfers), net: r2(income - expense) };
}
function spentByCat(ym) {
  const m = {};
  for (const t of txInMonth(ym)) if (t.type === 'expense') m[t.categoryId] = r2((m[t.categoryId] || 0) + t.amount);
  return m;
}
function budgetTotal() { return r2(sum(S.categories.filter(c => c.kind === 'expense'), c => c.budget)); }

/* Running balance across the account, up to and including `uptoISO` */
function accountBalance(accountId, uptoISO) {
  const a = acctById(accountId);
  let b = Number(a?.opening || 0);
  for (const t of S.transactions) {
    if (uptoISO && t.date > uptoISO) continue;
    if (t.type === 'transfer') {
      if (t.accountId === accountId) b -= t.amount;
      if (t.toAccountId === accountId) b += t.amount;
    } else if (t.accountId === accountId) {
      b += t.type === 'income' ? t.amount : -t.amount;
    }
  }
  return r2(b);
}
function totalBalance(uptoISO) { return r2(sum(S.accounts, a => accountBalance(a.id, uptoISO))); }

/* ---------- loan maths ---------- */
/* EMI for principal P, annual rate r%, n months */
function emiFor(P, r, n) {
  P = Number(P) || 0; r = Number(r) || 0; n = Math.round(Number(n) || 0);
  if (P <= 0 || n <= 0) return 0;
  if (r <= 0) return r2(P / n);
  const i = r / 1200;
  return r2(P * i * Math.pow(1 + i, n) / (Math.pow(1 + i, n) - 1));
}
function loanSchedule(loan) {
  const n = Math.round(Number(loan.tenure) || 0);
  const emi = Number(loan.emi) || emiFor(loan.principal, loan.rate, n);
  const i = (Number(loan.rate) || 0) / 1200;
  let bal = Number(loan.principal) || 0;
  const rows = [];
  for (let k = 0; k < n; k++) {
    const interest = r2(bal * i);
    let principal = r2(emi - interest);
    if (principal > bal) principal = bal;
    bal = r2(bal - principal);
    rows.push({ k, interest, principal, balance: bal, total: r2(principal + interest) });
    if (bal <= 0) break;
  }
  return { rows, emi, totalPayable: r2(sum(rows, x => x.total)), totalInterest: r2(sum(rows, x => x.interest)) };
}
/* How far along is this loan today? Regular EMIs counted from start date, plus prepayments. */
function loanStatus(loan, asOfISO) {
  const sch = loanSchedule(loan);
  const asOf = asOfISO || today();
  const started = loan.startDate && loan.startDate <= asOf;
  let paidCount = 0;
  if (started) {
    const a = parseISO(loan.startDate), b = parseISO(asOf);
    paidCount = (b.getFullYear() - a.getFullYear()) * 12 + (b.getMonth() - a.getMonth());
    if (b.getDate() >= Math.min(a.getDate(), daysInMonth(b.getFullYear(), b.getMonth()))) paidCount += 1;
    paidCount = clamp(paidCount, 0, sch.rows.length);
  }
  const prepay = sum(loan.prepayments || [], p => p.amount);
  const regular = paidCount > 0 ? sch.rows[paidCount - 1].balance : Number(loan.principal);
  const outstanding = r2(Math.max(0, regular - prepay));
  const interestPaid = r2(sum(sch.rows.slice(0, paidCount), x => x.interest));
  const principalPaid = r2(Math.min(Number(loan.principal), Number(loan.principal) - outstanding));
  const paid = r2(Number(loan.principal) - outstanding);
  const remaining = Math.max(0, sch.rows.length - paidCount);
  const nextDue = started ? nextOnDay(addDays(parseISO(asOf), 1), parseISO(loan.startDate).getDate()) : (loan.startDate || null);
  return {
    sch, paidCount, outstanding, interestPaid, principalPaid, paid,
    paidPct: Number(loan.principal) ? clamp(paid / Number(loan.principal) * 100, 0, 100) : 0,
    remaining, nextDue,
    payoffDate: remaining ? iso(addMonthsLocal(asOf <= loan.startDate ? parseISO(loan.startDate) : parseISO(asOf), remaining)) : null,
    done: outstanding <= 0
  };
}
function addMonthsLocal(d, n) {
  const y = d.getFullYear() + Math.floor((d.getMonth() + n) / 12);
  const m = ((d.getMonth() + n) % 12 + 12) % 12;
  return new Date(y, m, Math.min(d.getDate(), daysInMonth(y, m)), 12);
}

/* ---------- credit card maths ---------- */
/* Cycle containing `refISO`: statement is generated on statementDay. */
function cardCycle(card, refISO) {
  const ref = parseISO(refISO);
  const sd = clamp(Number(card.statementDay) || 1, 1, 28);
  const y = ref.getFullYear(), m = ref.getMonth();
  const stmtThis = new Date(y, m, Math.min(sd, daysInMonth(y, m)), 12);
  let cycleStart, cycleEnd, statementDate;
  if (ref <= stmtThis) {
    const py = m === 0 ? y - 1 : y, pm = (m + 11) % 12;
    cycleStart = addDays(new Date(py, pm, Math.min(sd, daysInMonth(py, pm)), 12), 1);
    statementDate = stmtThis;
  } else {
    const ny = m === 11 ? y + 1 : y, nm = (m + 1) % 12;
    cycleStart = addDays(stmtThis, 1);
    statementDate = new Date(ny, nm, Math.min(sd, daysInMonth(ny, nm)), 12);
  }
  cycleEnd = addDays(statementDate, 0);
  const dueDate = parseISO(nextOnDay(iso(addDays(statementDate, 1)), clamp(Number(card.dueDay) || 15, 1, 31)));
  return { cycleStart: iso(cycleStart), cycleEnd: iso(cycleEnd), statementDate: iso(statementDate), dueDate: iso(dueDate) };
}
/* Spend on a card inside a date range */
function cardSpend(cardId, fromISO, toISO) {
  return r2(sum(S.transactions.filter(t =>
    t.cardId === cardId && t.type === 'expense' && t.date >= fromISO && t.date <= toISO), t => t.amount));
}
/* Statement paid? A transfer entry to the card marked as bill payment. */
function cardPaidFor(cardId, statementDate) {
  const key = 'bill:' + cardId + ':' + statementDate;
  const pay = S.transactions.find(t => t.type === 'transfer' && t.cardId === cardId && t.billKey === key);
  return pay ? { amount: pay.amount, date: pay.date } : null;
}
/* Where the card stands today.
   cyc        — the cycle you are inside right now (its statement is still to come)
   prev       — the most recent statement already generated
   billed     — that statement's spend, less anything you have already paid
   unbilled   — spend since the last statement date, joins the next statement  */
function cardPosition(card, refISO) {
  const ref = refISO || today();
  const cyc = cardCycle(card, ref);
  const prev = cardCycle(card, iso(addDays(parseISO(cyc.cycleStart), -1)));
  const statementSpend = r2(cardSpend(card.id, prev.cycleStart, prev.cycleEnd));
  const paid = cardPaidFor(card.id, prev.statementDate);
  const outstanding = r2(Math.max(0, statementSpend - (paid ? paid.amount : 0)));
  const unbilled = r2(cardSpend(card.id, cyc.cycleStart, ref));
  const limit = Number(card.limit) || 0;
  const utilPct = limit ? clamp(r2((outstanding + unbilled) / limit * 100), 0, 100) : 0;
  const dueIn = daysBetween(today(), prev.dueDate);
  return {
    cyc, prev, statementSpend, outstanding, unbilled, paid, limit, utilPct, dueIn,
    total: r2(outstanding + unbilled),
    minDue: r2(Math.max(500, statementSpend * 0.05))
  };
}
/* Last N cycles with their spend, newest first — used for the statements list */
function cardStatements(card, count = 3) {
  const out = [];
  let ref = parseISO(today());
  for (let k = 0; k < count; k++) {
    const cyc = cardCycle(card, iso(ref));
    const spend = cardSpend(card.id, cyc.cycleStart, cyc.cycleEnd);
    out.push({ ...cyc, spend, paid: cardPaidFor(card.id, cyc.statementDate), minDue: r2(Math.max(500, spend * 0.05)) });
    ref = addDays(parseISO(cyc.cycleStart), -1);
  }
  return out;
}

/* Bills that land once, in full — projecting them day-by-day would be wrong */
const FIXED_CATS = new Set(['Rent', 'Electricity', 'Mobile & internet', 'Insurance', 'School & fees', 'Subscriptions']);

/* ---------- the suggestion engine ---------- */
/* Returns a ranked list of things worth knowing about this month. */
function insights(ym) {
  const out = [];
  const { start, dim, y, m0 } = monthBounds(ym);
  const isCurrent = ym === today().slice(0, 7);
  const isPast = ym < today().slice(0, 7);
  const t = monthTotals(ym);
  const spent = spentByCat(ym);
  const dayNow = isCurrent ? new Date().getDate() : dim;
  const daysLeft = isCurrent ? Math.max(0, dim - dayNow) : 0;
  const elapsed = clamp(dayNow, 1, dim);
  const expCats = S.categories.filter(c => c.kind === 'expense');

  /* --- 1. categories already over budget --- */
  const over = [], near = [], pace = [];
  for (const c of expCats) {
    const used = spent[c.id] || 0, b = Number(c.budget) || 0;
    if (b <= 0 || used <= 0) continue;
    const left = r2(b - used), usedPct = used / b * 100;
    const projected = isCurrent && !FIXED_CATS.has(c.name) ? r2(used / elapsed * dim) : used;
    if (left < 0) over.push({ c, used, b, left, usedPct, projected });
    else if (isCurrent && left > 0 && projected > b * 1.02) pace.push({ c, used, b, left, usedPct, projected });
    else if (usedPct >= 80) near.push({ c, used, b, left, usedPct, projected });
  }
  over.sort((a, b) => a.left - b.left);
  pace.sort((a, b) => (b.projected - b.b) - (a.projected - a.b));

  for (const x of over.slice(0, 4)) {
    out.push({
      level: 'over', rank: 100 + Math.abs(x.left) / 1000,
      html: `<strong>${esc(x.c.name)}</strong> is over budget by <span class="amt">${money(-x.left)}</span> — you've spent <span class="amt">${money(x.used)}</span> of <span class="amt">${money(x.b)}</span>.` +
        (daysLeft > 0 ? ` Stop here for the rest of the month, or move <span class="amt">${money(-x.left)}</span> from another category.` : ` It was <span class="amt">${money(-x.left)}</span> over by month end.`)
    });
  }
  for (const x of pace.slice(0, 3)) {
    const willBeOver = r2(x.projected - x.b);
    out.push({
      level: 'warn', rank: 70 + willBeOver / 1000,
      html: `<strong>${esc(x.c.name)}</strong> is on pace for <span class="amt">${money(x.projected)}</span> against a <span class="amt">${money(x.b)}</span> budget — about <span class="amt">${money(willBeOver)}</span> over.` +
        (daysLeft > 0 ? ` Keeping it to <span class="amt">${money(Math.max(0, x.left) / Math.max(1, daysLeft))}</span> a day for the ${daysLeft} days left holds the line.` : '')
    });
  }
  for (const x of near.slice(0, 2)) {
    out.push({
      level: 'warn', rank: 40 + x.usedPct / 100,
      html: `<strong>${esc(x.c.name)}</strong> is at <strong>${pct(x.usedPct)}</strong> of budget with <span class="amt">${money(x.left)}</span> left` +
        (daysLeft > 0 ? ` — that's <span class="amt">${money(x.left / Math.max(1, daysLeft))}</span> a day for ${daysLeft} days.` : '.')
    });
  }

  /* --- 2. overall budget vs income --- */
  const bt = budgetTotal();
  if (t.income > 0 && bt > t.income) {
    out.push({
      level: 'over', rank: 95,
      html: `Your budgets add up to <span class="amt">${money(bt)}</span> but income this month is <span class="amt">${money(t.income)}</span> — the plan overshoots by <span class="amt">${money(bt - t.income)}</span>. Trim budgets or plan for savings of nothing.`
    });
  }
  if (t.income > 0 && bt > 0 && bt <= t.income && t.income - bt < t.income * 0.1) {
    out.push({
      level: 'info', rank: 30,
      html: `Budgets use <strong>${pct(bt / t.income * 100)}</strong> of income, leaving <span class="amt">${money(t.income - bt)}</span> unallocated. Park a fixed amount as savings before the month starts.`
    });
  }

  {
    const sal = Number(S.settings.salary) || 0, goal = r2(sal * (Number(S.settings.savingsPct) || 0) / 100), cap = r2(sal - goal);
    if (sal > 0 && bt > cap + 0.5) {
      out.push({ level: 'over', rank: 94,
        html: `Category limits total <span class="amt">${money(bt)}</span>, but a <span class="amt">${money(goal)}</span> savings goal leaves only <span class="amt">${money(cap)}</span> to spend. Use “Fit limits to salary” in Budgets.` });
    }
    if (sal > 0 && t.expense > cap) {
      out.push({ level: 'over', rank: 96,
        html: `Spending of <span class="amt">${money(t.expense)}</span> has passed the <span class="amt">${money(cap)}</span> available after saving <span class="amt">${money(goal)}</span> — the savings goal is now at risk.` });
    }
  }

  /* --- 3. spending pace for the whole month --- */
  if (isCurrent && daysLeft > 2 && t.expense > 0) {
    const fixedSpent = sum(t.list.filter(x => x.type === 'expense' && FIXED_CATS.has(catName(x))), x => x.amount);
    const perDay = (t.expense - fixedSpent) / elapsed;
    const projected = r2(fixedSpent + perDay * dim);
    if (bt > 0 && projected > bt) {
      out.push({
        level: 'warn', rank: 80,
        html: `Day-to-day spending (leaving out rent and fixed bills) is running at <span class="amt">${money(perDay)}</span> a day. At this pace the month lands near <span class="amt">${money(projected)}</span>, roughly <span class="amt">${money(projected - bt)}</span> above your total budget.`
      });
    } else {
      out.push({
        level: 'ok', rank: 10,
        html: `Day-to-day spend (leaving out rent and fixed bills) is averaging <span class="amt">${money(perDay)}</span>, which puts the month on track for <span class="amt">${money(projected)}</span>.`
      });
    }
  }
  if (isPast) {
    const bt2 = budgetTotal();
    if (bt2 > 0) {
      const diff = r2(t.expense - bt2);
      if (diff <= 0) out.push({ level: 'ok', rank: 12, html: `Spending finished <span class="amt">${money(-diff)}</span> under the total budget.` });
    }
    if (t.income > 0) {
      const rate = (t.income - t.expense) / t.income * 100;
      out.push({
        level: rate >= 20 ? 'ok' : rate >= 0 ? 'info' : 'over', rank: 20,
        html: rate >= 0
          ? `You saved <span class="amt">${money(t.income - t.expense)}</span> — <strong>${pct(rate)}</strong> of income.`
          : `You spent <span class="amt">${money(-(t.income - t.expense))}</span> more than you earned.`
      });
    }
  }

  /* --- 4. savings and daily allowance --- */
  if (isCurrent && t.income > 0) {
    const rate = t.net / t.income * 100;
    if (rate >= 20) out.push({ level: 'ok', rank: 15, html: `Income minus spending so far leaves <span class="amt">${money(t.net)}</span> — a <strong>${pct(rate)}</strong> savings rate.` });
    else if (rate >= 0 && rate < 20) out.push({ level: 'info', rank: 25, html: `Savings rate is <strong>${pct(rate)}</strong> so far (<span class="amt">${money(t.net)}</span>). Below 20% is thin cover for a surprise expense.` });
    else if (rate < 0) out.push({ level: 'over', rank: 90, html: `Spending has passed income by <span class="amt">${money(-t.net)}</span> this month.` });
  }
  if (isCurrent && bt > 0 && daysLeft > 0) {
    const left = r2(bt - t.expense);
    if (left > 0) out.push({
      level: 'info', rank: 8,
      html: `<span class="amt">${money(left)}</span> of the total budget is still unspent. That allows <span class="amt">${money(left / daysLeft)}</span> a day for the ${daysLeft} days left.`
    });
  }

  /* --- 5. upcoming dues against available money (next 21 days) --- */
  const dues = upcomingDues(21);
  if (dues.length) {
    const dueTotal = r2(sum(dues, d => d.amount));
    out.push({
      level: 'info', rank: 60,
      html: `<strong>${dues.length}</strong> payment${dues.length > 1 ? 's' : ''} totalling <span class="amt">${money(dueTotal)}</span> fall due in the next three weeks${dues[0] ? `, starting with ${esc(dues[0].name)} on <strong>${fmtDay(dues[0].date)}</strong>` : ''}.`
    });
    const avail = totalBalance(today());
    if (dueTotal > avail) {
      out.push({
        level: 'over', rank: 98,
        html: `Account balances total <span class="amt">${money(avail)}</span> against <span class="amt">${money(dueTotal)}</span> of dues in the next three weeks. There's a shortfall of <span class="amt">${money(dueTotal - avail)}</span> unless income lands first.`
      });
    } else if (dueTotal > avail * 0.6) {
      out.push({
        level: 'warn', rank: 65,
        html: `Dues of <span class="amt">${money(dueTotal)}</span> would take <strong>${pct(dueTotal / avail * 100)}</strong> of the <span class="amt">${money(avail)}</span> you hold across accounts. Keep a buffer for the rest of the month.`
      });
    }
  }

  /* --- 6. card utilisation --- */
  for (const card of S.cards) {
    const pos = cardPosition(card, today());
    if (!pos.limit) continue;
    if (pos.utilPct >= 30) {
      out.push({
        level: pos.utilPct >= 50 ? 'over' : 'warn', rank: 55 + pos.utilPct / 10,
        html: `<strong>${esc(card.name)}</strong> is at <strong>${pct(pos.utilPct)}</strong> of its <span class="amt">${moneyShort(pos.limit)}</span> limit this cycle. Keeping utilisation under 30% protects your credit score.`
      });
    }
    if (pos.dueIn >= 0 && pos.dueIn <= 7 && pos.outstanding > 0) {
      out.push({
        level: pos.dueIn <= 2 ? 'over' : 'warn', rank: 92,
        html: `<strong>${esc(card.name)}</strong> bill of <span class="amt">${money(pos.outstanding)}</span> is due on <strong>${fmtDay(pos.prev.dueDate)}</strong>${pos.dueIn === 0 ? ' — today' : ` — in ${pos.dueIn} day${pos.dueIn > 1 ? 's' : ''}`}. Paying only the minimum of <span class="amt">${money(pos.minDue)}</span> starts interest on the rest.`
      });
    }
  }

  /* --- 7. biggest single spend and concentration --- */
  const big = t.list.filter(x => x.type === 'expense').sort((a, b) => b.amount - a.amount)[0];
  if (big && big.amount >= Math.max(2000, t.expense * 0.25)) {
    out.push({
      level: 'info', rank: 22,
      html: `The largest single expense was <span class="amt">${money(big.amount)}</span> on ${esc(catName(big))}${big.note ? ' — ' + esc(big.note) : ''} (${fmtDay(big.date)}), <strong>${pct(big.amount / t.expense * 100)}</strong> of the month's spending.`
    });
  }
  const cats = expCats.map(c => ({ c, v: spent[c.id] || 0 })).filter(x => x.v > 0).sort((a, b) => b.v - a.v);
  if (cats.length >= 3 && t.expense > 0 && cats[0].v / t.expense > 0.35) {
    out.push({
      level: 'info', rank: 18,
      html: `<strong>${esc(cats[0].c.name)}</strong> alone is <strong>${pct(cats[0].v / t.expense * 100)}</strong> of everything you spent — the top three categories are ${cats.slice(0, 3).map(x => esc(x.c.name).toLowerCase()).join(', ')}.`
    });
  }

  /* --- 8. categories with spending but no budget --- */
  const unbudgeted = expCats.filter(c => !(Number(c.budget) > 0) && (spent[c.id] || 0) > 0);
  if (unbudgeted.length) {
    out.push({
      level: 'info', rank: 28,
      html: `${unbudgeted.length} categor${unbudgeted.length > 1 ? 'ies have' : 'y has'} spending but no budget set (${unbudgeted.slice(0, 3).map(c => esc(c.name).toLowerCase()).join(', ')}). Give ${unbudgeted.length > 1 ? 'them' : 'it'} a limit to make the month predictable.`
    });
  }
  /* --- 9. loans --- */
  for (const l of S.loans) {
    const st = loanStatus(l);
    const next = nextEMI(l);
    if (next && daysBetween(today(), next.date) >= 0 && daysBetween(today(), next.date) <= 10 && !next.paid) {
      out.push({
        level: 'warn', rank: 85,
        html: `<strong>${esc(l.name)}</strong> EMI of <span class="amt">${money(st.sch.emi)}</span> is due on <strong>${fmtDay(next.date)}</strong>${next.date === today() ? ' — today' : ''}.`
      });
    }
    if (st.interestPaid > 0 && l.principal > 0 && st.paidPct >= 25 && st.paidPct <= 60) {
      out.push({
        level: 'info', rank: 26,
        html: `On <strong>${esc(l.name)}</strong> you've paid <span class="amt">${money(st.paid)}</span> so far but <strong>${pct(st.interestPaid / st.paid * 100)}</strong> of that was interest. A prepayment now cuts more than one later.`
      });
    }
  }

  return out.sort((a, b) => b.rank - a.rank);
}

/* Next EMI date for a loan, and whether that month is already paid */
function nextEMI(loan) {
  if (!loan.startDate) return null;
  const day = parseISO(loan.startDate).getDate();
  const start = parseISO(loan.startDate);
  if (start > new Date()) return { date: iso(start), paid: false };
  const thisMonth = nextOnDay(today().slice(0, 8) + '01', day);
  const paid = (loan.payments || []).some(p => ymOf(p.date) === ymOf(thisMonth));
  if (thisMonth < today() && !paid) {
    const nxt = nextOnDay(today(), day);
    return { date: nxt, paid: (loan.payments || []).some(p => ymOf(p.date) === ymOf(nxt)) };
  }
  return { date: thisMonth, paid };
}

/* Everything owed in the next `days` days: EMIs, card bills. */
function upcomingDues(days = 30) {
  const out = [];
  const horizon = iso(addDays(new Date(), days));
  for (const l of S.loans) {
    const st = loanStatus(l);
    if (st.done) continue;
    const day = parseISO(l.startDate).getDate();
    let cursor = today();
    for (let k = 0; k < Math.ceil(days / 30) + 2; k++) {
      const d = nextOnDay(cursor, day);
      if (d > horizon) break;
      const paid = (l.payments || []).some(p => ymOf(p.date) === ymOf(d));
      if (!paid && d >= today()) out.push({ kind: 'emi', name: l.name + ' EMI', date: d, amount: st.sch.emi, loanId: l.id, paid });
      cursor = iso(addDays(parseISO(d), 1));
    }
  }
  for (const card of S.cards) {
    const pos = cardPosition(card, today());
    if (pos.statementSpend > 0 && pos.prev.dueDate >= today() && pos.prev.dueDate <= horizon) {
      out.push({
        kind: 'card', name: card.name + ' bill', date: pos.prev.dueDate,
        amount: pos.statementSpend, cardId: card.id, paid: !!pos.paid,
        paidAmount: pos.paid ? pos.paid.amount : 0, minDue: pos.minDue,
        statementDate: pos.prev.statementDate
      });
    }
  }
  return out.sort((a, b) => a.date < b.date ? -1 : 1);
}
